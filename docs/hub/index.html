<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>셀렉트인 OPS</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b4a35">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="셀렉트인 OPS">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="../icon-192.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<script src="config.js?v=2"></script>
<style>
:root{
  --bg:#f4f5f7; --card:#fff; --ink:#15171a; --sub:#5b6370; --mute:#8a919c; --line:#e3e6ea; --line2:#d3d8de;
  --brand:#0b4a35; --brand-ink:#fff; --accent:#178a62; --soft:#e8f5ef; --hover:#f0f2f4;
  --red:#c92a2a; --redbg:#fdecec; --amber:#a15c07; --amberbg:#fff4e0; --blue:#1d5fd1; --bluebg:#e9f0fd;
  --radius:12px; --side:236px;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0f1115; --card:#181b21; --ink:#eef0f3; --sub:#a4acb7; --mute:#7c8591; --line:#2a2f37; --line2:#363c46;
    --brand:#7fd1ae; --brand-ink:#0b2a1f; --accent:#4cc795; --soft:#16271f; --hover:#20242b;
    --red:#ff7b7b; --redbg:#3a1d1d; --amber:#f5b454; --amberbg:#2e2414; --blue:#7fb0ff; --bluebg:#18233a; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:15px;line-height:1.55;letter-spacing:-.1px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.num{font-variant-numeric:tabular-nums}
.ti{font-size:20px;line-height:1;vertical-align:-3px}

/* ---------- 레이아웃 ---------- */
.side{position:fixed;inset:0 auto 0 0;width:var(--side);background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:20}
.brand{text-decoration:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:20px 20px 16px;font-weight:700;font-size:17px;color:var(--brand)}
.brand img{width:32px;height:32px;border-radius:8px}
.brand small{display:block;font-weight:500;font-size:12px;color:var(--mute)}
.side nav{flex:1;overflow-y:auto;padding:4px 12px 16px}
.side .grp{font-size:12px;font-weight:600;color:var(--mute);padding:14px 10px 6px}
.side a.it{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;color:var(--sub);text-decoration:none;font-size:15px;font-weight:500}
.side a.it:hover{background:var(--hover);color:var(--ink)}
.side a.it.on{background:var(--soft);color:var(--brand);font-weight:700}
.side a.it .cnt{margin-left:auto;font-size:12px;font-weight:700;background:var(--redbg);color:var(--red);border-radius:99px;padding:1px 8px}
.side a.it .soon{margin-left:auto;font-size:11px;color:var(--mute);font-weight:500}
.side .me{border-top:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:10px;font-size:14px}
.side .me .av{width:32px;height:32px;border-radius:50%;background:var(--soft);color:var(--brand);display:grid;place-items:center;font-weight:700}
.side .me small{display:block;color:var(--mute);font-size:12px}
main{margin-left:var(--side);min-height:100vh;padding:28px 32px 60px}
.wrap{max-width:1120px;margin:0 auto}
.topbar{display:none}
.tabbar{display:none}

.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.ph h1{margin:0;font-size:24px;font-weight:700;letter-spacing:-.5px}
.ph p{margin:4px 0 0;color:var(--sub);font-size:14px}
.ph .acts{display:flex;gap:8px;flex-wrap:wrap}

.demo{display:flex;align-items:center;gap:10px;background:var(--amberbg);color:var(--amber);border-radius:10px;padding:10px 14px;font-size:14px;margin-bottom:18px}
.demo b{font-weight:700}

/* ---------- 공통 요소 ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px}
.card+.card{margin-top:16px}
.grid>.card+.card{margin-top:0}
.card h2{margin:0 0 12px;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:8px}
.card h2 small{font-weight:500;font-size:13px;color:var(--mute)}
.grid{display:grid;gap:16px}
.grid>*{min-width:0}
html,body{max-width:100%;overflow-x:hidden}
.list .li,.todo,.mc{min-width:0}
.list .li .e,.mc .e{max-width:40%}
.g4{grid-template-columns:repeat(4,1fr)}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;text-decoration:none;color:inherit;display:block}
a.kpi:hover{border-color:var(--line2)}
.kpi{width:100%}
.kpi .k{font-size:13px;color:var(--sub);display:flex;align-items:center;gap:6px}
.kpi .v{font-size:28px;font-weight:700;letter-spacing:-.6px;margin-top:4px}
.kpi .v small{font-size:15px;font-weight:500;color:var(--sub);margin-left:2px}
.kpi.red .v{color:var(--red)} .kpi.amber .v{color:var(--amber)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--line2);background:var(--card);color:var(--ink);font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.dng{color:var(--red);border-color:var(--line2)}
.btn.sm{height:32px;padding:0 10px;font-size:13px;border-radius:8px}
.btn.lg{height:52px;font-size:16px;border-radius:12px;padding:0 22px}
.btn:disabled{opacity:.45;cursor:default}
.btn .ti{font-size:18px}

.fld{display:block;margin-bottom:14px}
.fld>span{display:block;font-size:13px;font-weight:600;color:var(--sub);margin-bottom:6px}
.fld>span em{font-style:normal;color:var(--red)}
.inp,select.inp,textarea.inp{width:100%;height:42px;border:1px solid var(--line2);border-radius:10px;background:var(--card);padding:0 12px;font-size:15px;outline:none}
textarea.inp{height:auto;min-height:96px;padding:10px 12px;resize:vertical;line-height:1.5}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--soft)}
.inp.r{text-align:right}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 12px}

.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:7px;font-size:14px;color:var(--sub);cursor:pointer;font-weight:500}
.seg button.on{background:var(--card);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}

.search{position:relative;flex:1;min-width:220px}
.search .ti{position:absolute;left:12px;top:11px;color:var(--mute)}
.search .inp{padding-left:40px}

.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:center;font-size:12.5px;font-weight:600;color:var(--sub);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--card);position:sticky;top:0}
.tbl td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--hover)}
.tbl .r{text-align:right}
.tbl .nm{font-weight:600}
.tbl .sm{font-size:12.5px;color:var(--mute)}
.tblwrap{overflow-x:auto;margin:0 -20px;padding:0 20px}

.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--bg);color:var(--sub);white-space:nowrap}
.pill.g{background:var(--soft);color:var(--accent)}
.pill.r{background:var(--redbg);color:var(--red)}
.pill.a{background:var(--amberbg);color:var(--amber)}
.pill.b{background:var(--bluebg);color:var(--blue)}

.list .li{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.list .li:first-child{border-top:0;padding-top:4px}
.list .li .m{flex:1;min-width:0}
.list .li .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list .li .s{font-size:13px;color:var(--mute)}
.list .li .e{text-align:right;flex:none}
.empty{color:var(--mute);font-size:14px;padding:18px 0;text-align:center}
.qty{font-weight:700}
.qty.p{color:var(--accent)} .qty.m{color:var(--red)}

.todo{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.todo:first-child{border-top:0;padding-top:2px}
.todo .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--bg);color:var(--sub)}
.todo .ic.ok{background:var(--soft);color:var(--accent)} .todo .ic.warn{background:var(--amberbg);color:var(--amber)} .todo .ic.bad{background:var(--redbg);color:var(--red)}
.todo .m{flex:1;min-width:0}
.todo .t{font-weight:600}
.todo .s{font-size:13px;color:var(--mute)}

.tool{display:flex;gap:14px;align-items:flex-start;padding:16px;border:1px solid var(--line);border-radius:var(--radius);background:var(--card);text-decoration:none;color:inherit}
.tool:hover{border-color:var(--accent)}
.tool .ic{width:42px;height:42px;border-radius:11px;background:var(--soft);color:var(--brand);display:grid;place-items:center;flex:none}
.tool .ic .ti{font-size:22px}
.tool .t{font-weight:700;font-size:15px}
.tool .s{font-size:13px;color:var(--sub);margin-top:2px}
.tool .u{font-size:12px;color:var(--mute);margin-top:6px;word-break:break-all}

.plan li{margin:6px 0;color:var(--sub)}
.plan li b{color:var(--ink);font-weight:600}

/* ---------- 재고 입출고 ---------- */
.mv-type{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.mv-type button{height:56px;border-radius:12px;border:2px solid var(--line);background:var(--card);font-size:16px;font-weight:700;color:var(--sub);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.mv-type button.on.in{border-color:var(--accent);color:var(--accent);background:var(--soft)}
.mv-type button.on.out{border-color:var(--red);color:var(--red);background:var(--redbg)}
.mv-type button.on.adjust{border-color:var(--blue);color:var(--blue);background:var(--bluebg)}
.scanrow{display:flex;gap:8px}
.scanrow .search{min-width:0}
.pick{margin-top:12px;border:1px solid var(--line);border-radius:10px;max-height:280px;overflow-y:auto}
.pick button{display:flex;width:100%;text-align:left;gap:10px;align-items:center;padding:10px 12px;border:0;border-top:1px solid var(--line);background:var(--card);cursor:pointer}
.pick button:first-child{border-top:0}
.pick button:hover{background:var(--hover)}
.sel{margin-top:16px;border:2px solid var(--accent);border-radius:14px;padding:16px;background:var(--soft)}
.sel .nm{font-size:18px;font-weight:700}
.sel .meta{font-size:13px;color:var(--sub);margin-top:2px}
.sel .stk{display:flex;align-items:baseline;gap:6px;margin-top:10px;font-size:14px;color:var(--sub)}
.sel .stk b{font-size:26px;color:var(--ink)}
.stepper{display:flex;align-items:center;gap:8px;margin-top:14px}
.stepper button{width:52px;height:52px;border-radius:12px;border:1px solid var(--line2);background:var(--card);font-size:24px;cursor:pointer}
.stepper input{flex:1;height:52px;text-align:center;font-size:24px;font-weight:700;border:1px solid var(--line2);border-radius:12px;background:var(--card)}
.preview{font-size:14px;color:var(--sub);margin-top:10px;text-align:center}
.preview b{color:var(--ink)}

/* ---------- 모달/시트 ---------- */
.ov{position:fixed;inset:0;background:rgba(10,14,20,.42);z-index:50;display:flex;justify-content:flex-end}
.drawer{width:min(560px,100%);height:100%;background:var(--card);display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.12)}
.drawer .hd{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.drawer .hd h3{margin:0;font-size:18px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drawer .bd{flex:1;overflow-y:auto;padding:20px}
.drawer .ft{display:flex;gap:8px;justify-content:flex-end;padding:14px 20px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.x{width:36px;height:36px;border-radius:9px;border:0;background:var(--bg);cursor:pointer;display:grid;place-items:center;flex:none}
.tabs2{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:-4px 0 16px}
.tabs2 button{border:0;background:none;padding:10px 12px;font-size:14px;font-weight:600;color:var(--mute);border-bottom:2px solid transparent;cursor:pointer}
.tabs2 button.on{color:var(--ink);border-bottom-color:var(--brand)}
.cam{position:relative;background:#000;border-radius:12px;overflow:hidden;aspect-ratio:4/3}
.cam video{width:100%;height:100%;object-fit:cover;display:block}
.cam .aim{position:absolute;left:12%;right:12%;top:38%;bottom:38%;border:2px solid rgba(255,255,255,.9);border-radius:10px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.cammsg{text-align:center;color:var(--sub);font-size:14px;margin-top:10px}

.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#1e2329;color:#fff;padding:12px 18px;border-radius:12px;font-size:15px;z-index:90;box-shadow:0 6px 24px rgba(0,0,0,.25);max-width:calc(100% - 32px)}
.toast.err{background:var(--red);color:#fff}

/* ---------- 로그인 ---------- */
.login{min-height:100vh;display:grid;place-items:center;padding:24px}
.login .box{width:100%;max-width:380px;text-align:center}
.login img{width:72px;height:72px;border-radius:18px}
.login h1{font-size:22px;margin:14px 0 4px}
.login p{color:var(--sub);margin:0 0 22px;font-size:14px}
.login .inp{height:50px;font-size:16px;margin-bottom:10px;text-align:left}
.login .btn{width:100%;height:50px;font-size:16px}
.login .msg{color:var(--red);font-size:14px;min-height:22px;margin-top:10px}
.login .alt{margin-top:18px;font-size:14px}
.login .alt button{border:0;background:none;color:var(--accent);font-weight:600;cursor:pointer;text-decoration:underline}

/* ---------- 모바일 ---------- */
.mcards{display:none}
@media (max-width:900px){
  .side{display:none}
  main{margin-left:0;padding:0 16px calc(96px + env(safe-area-inset-bottom))}
  .topbar{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:15;background:var(--bg);padding:calc(12px + env(safe-area-inset-top)) 0 10px;margin:0 0 6px}
  .topbar img{width:28px;height:28px;border-radius:7px}
  .topbar b{font-size:17px;color:var(--brand);flex:1}
  .ph{margin-bottom:14px}
  .ph h1{font-size:21px}
  .ph .acts{width:100%}
  .ph .acts .btn{flex:1}
  .g4{grid-template-columns:1fr 1fr}
  .g2,.g3{grid-template-columns:1fr}
  .grid{gap:12px}
  .card{padding:16px}
  .kpi{padding:14px}
  .kpi .v{font-size:24px}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  .tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;border-radius:10px;color:var(--mute);text-decoration:none;font-size:12px;font-weight:500}
  .tabbar a .ti{font-size:24px}
  .tabbar a.on{color:var(--brand);font-weight:700}
  .tabbar a.scan{color:var(--brand-ink)}
  .tabbar a.scan span.c{width:52px;height:52px;margin-top:-22px;border-radius:50%;background:var(--brand);display:grid;place-items:center;box-shadow:0 4px 14px rgba(11,74,53,.35);border:4px solid var(--bg)}
  .tabbar a.scan span.c .ti{font-size:26px;color:var(--brand-ink)}
  .tabbar a.scan small{color:var(--brand);font-weight:700}
  .dtable{display:none}
  .mcards{display:block}
  .ov{align-items:flex-end}
  .drawer{height:92vh;border-radius:18px 18px 0 0}
  .row3{grid-template-columns:1fr 1fr}
  .rowb{grid-template-columns:1fr}
  .toast{bottom:calc(92px + env(safe-area-inset-bottom))}
}
.mc{display:flex;gap:12px;align-items:center;padding:14px 0;border-top:1px solid var(--line);cursor:pointer}
.mc:first-child{border-top:0;padding-top:4px}
.mc .m{flex:1;min-width:0}
.mc .t{font-weight:600;font-size:15px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mc .s{font-size:13px;color:var(--mute);margin-top:2px}
.mc .e{text-align:right;flex:none}
.mc .e b{font-size:18px}
.more-menu a{display:flex;align-items:center;gap:12px;padding:14px 4px;border-top:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:16px;font-weight:500}
.more-menu a:first-child{border-top:0}
.more-menu a .ti{color:var(--sub)}
.more-menu a .soon{margin-left:auto;font-size:12px;color:var(--mute)}
.hide{display:none!important}
@media (max-width:900px){.pconly{display:none!important}}
.photos{display:flex;gap:10px;flex-wrap:wrap}
.photos .ph1{position:relative;width:88px;height:88px;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--bg)}
.photos .ph1 img{width:100%;height:100%;object-fit:cover}
.photos .ph1 b{position:absolute;left:4px;top:4px;font-size:11px;background:var(--brand);color:var(--brand-ink);border-radius:6px;padding:1px 6px}
.photos .ph1 button{position:absolute;right:4px;top:4px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;cursor:pointer;font-size:14px;line-height:1}
.photos .add{width:88px;height:88px;border-radius:12px;border:2px dashed var(--line2);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--sub);font-size:12px;cursor:pointer}
.photos .add .ti{font-size:26px}
.sec{font-size:14px;font-weight:700;margin:20px 0 10px;padding-top:16px;border-top:1px solid var(--line);display:flex;align-items:center;gap:6px}
.sec:first-child{margin-top:0;padding-top:0;border-top:0}
.sec{flex-wrap:wrap}
.sec small{flex-basis:100%;font-weight:500;color:var(--mute);font-size:12.5px;margin-top:2px}
.g3k{grid-template-columns:repeat(3,1fr)!important}
@media (max-width:900px){.g3k .kpi .v{font-size:22px}.g3k .kpi .k{font-size:12px}}
.scanov{position:fixed;inset:0;z-index:80;background:#0b0d10;display:flex;flex-direction:column;color:#fff}
.scanov .sh{display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 16px 12px}
.scanov .sh b{flex:1;font-size:17px}
.scanov .sh button{width:40px;height:40px;border-radius:10px;border:0;background:rgba(255,255,255,.12);color:#fff;display:grid;place-items:center;cursor:pointer}
.scanov .sb{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 16px}
.scanov .cam{aspect-ratio:3/4;max-height:62vh;width:100%;max-width:560px;margin:0 auto}
.scanov .cammsg{color:rgba(255,255,255,.75)}
.scanov .sf{display:flex;gap:8px;padding:12px 16px calc(16px + env(safe-area-inset-bottom));max-width:592px;width:100%;margin:0 auto}
.scanov .sf input{flex:1;min-width:0;height:48px;border-radius:12px;border:0;padding:0 14px;font-size:16px;background:#fff;color:#111}
.scanov .sf button{white-space:nowrap;flex:none;height:48px;border-radius:12px;border:0;padding:0 18px;font-size:15px;font-weight:700;background:var(--accent);color:#fff;cursor:pointer}

<body>
<div id="app"></div>

<script>
var APP_BUILD = '2026-10-27q';
var API = (window.HUB_API || '').trim();
var DEMO = false;
var S = { me: null, products: [], history: [], config: {}, users: [] };
var LS_TOKEN = 'hubToken_v1', LS_DEMO = 'hubDemo_v1', LS_CACHE = 'hubCache_v1';

/* ===================== 유틸 ===================== */
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function won(n){ n=Number(n)||0; return n.toLocaleString('ko-KR'); }
function lsGet(k){ try{ var s=localStorage.getItem(k); return s?JSON.parse(s):null; }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }
function nowStr(){ var d=new Date(Date.now()+9*36e5); return d.toISOString().slice(0,16).replace('T',' '); }
function today(){ return nowStr().slice(0,10); }
function toast(msg,err){ var t=document.createElement('div'); t.className='toast'+(err?' err':''); t.textContent=msg; document.body.appendChild(t); setTimeout(function(){ t.remove(); }, err?3600:2200); }
function margin(p){ if(!p.price) return null; return (p.price-p.cost)/p.price*100; }
function isVirtual(p){ return p.stocMng==='N'; }
function stockState(p){ if(p.type==='위탁' || p.sbnStatus==='미사용' || isVirtual(p)) return 'na'; if(p.stock<=0) return 'out'; if(p.safety && p.stock<=p.safety) return 'low'; return 'ok'; }
function stockMode(p){ return p.type==='위탁' ? '위탁' : isVirtual(p) ? '가상재고' : '현재고'; }
function stockLink(p){ return p.sbnPrd ? '사방넷 연동' : '앱 단독'; }
function stockCell(p){
  var m = stockMode(p), s = stockState(p);
  var top = m==='위탁' ? '<b>—</b>' : m==='가상재고' ? '<b class="vq">'+won(p.vstock||0)+'</b>' : '<b>'+won(p.stock)+'</b>';
  var tags = '<span class="pill '+(m==='현재고'?'g':'')+'">'+m+'</span>'+(s==='out'?' <span class="pill r">품절</span>':s==='low'?' <span class="pill a">부족</span>':'');
  return '<div class="stk2">'+top+'<div>'+tags+'</div><span class="lk" title="'+(p.sbnPrd?'사방넷 '+esc(p.sbnPrd)+'-'+esc(p.sbnSku)+' '+(m==='가상재고'?'가상재고':'현재고')+'와 연결 · 사방넷 동기화 때 맞춰져요':'사방넷과 연결되지 않은 상품 · 앱 입출고로만 바뀌어요')+'">'+stockLink(p)+'</span></div>';
}
function stockPill(p){
  var s=stockState(p);
  if(isVirtual(p)) return '<span class="pill">가상재고</span>';
  if(s==='out') return '<span class="pill r">품절</span>';
  if(s==='low') return '<span class="pill a">부족</span>';
  return '';
}
function thumb(p,lg){ var c='th'+(lg?' lg':''); return p.img ? '<img class="'+c+'" loading="lazy" referrerpolicy="no-referrer" src="'+esc(p.img)+'" alt="" onerror="this.removeAttribute(\'src\');this.alt=\'\'">' : '<span class="'+c+'"><i class="ti ti-photo"></i></span>'; }
function sbnLabel(p){ return p.sbnPrd ? '사방넷 '+esc(p.sbnPrd)+(p.sbnSku?'-'+esc(p.sbnSku):'') : ''; }
function sbnPill(p){ return p.sbnStatus && p.sbnStatus!=='판매' && p.sbnStatus!=='공급중' ? ' <span class="pill">'+esc(p.sbnStatus)+'</span>' : ''; }
var PG = {size: (function(){ var v=+lsGetRaw('hubPageSize'); return [25,50,100,200,500].indexOf(v)>=0?v:50; })()};
function pagerHtml(total, page, size){
  var pages = Math.max(1, Math.ceil(total/size)); page = Math.min(Math.max(1,page),pages);
  var from = total? (page-1)*size+1 : 0, to = Math.min(total, page*size);
  var nums = [], i, lo = Math.max(1, page-2), hi = Math.min(pages, lo+4); lo = Math.max(1, hi-4);
  if (lo>1){ nums.push(1); if(lo>2) nums.push('…'); }
  for(i=lo;i<=hi;i++) nums.push(i);
  if (hi<pages){ if(hi<pages-1) nums.push('…'); nums.push(pages); }
  return '<div class="pager"><div class="cnt">총 <b class="num">'+won(total)+'</b>개 · '+won(from)+'–'+won(to)+'</div>'+
    '<div class="pg"><button data-pg="'+(page-1)+'"'+(page<=1?' disabled':'')+' aria-label="이전"><i class="ti ti-chevron-left"></i></button>'+
    nums.map(function(n){ return n==='…'?'<span>…</span>':'<button data-pg="'+n+'" class="'+(n===page?'on':'')+'">'+n+'</button>'; }).join('')+
    '<button data-pg="'+(page+1)+'"'+(page>=pages?' disabled':'')+' aria-label="다음"><i class="ti ti-chevron-right"></i></button></div>'+
    '<label style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub)">한 페이지에 <select data-size>'+[25,50,100,200,500].map(function(v){ return '<option'+(v===size?' selected':'')+'>'+v+'</option>'; }).join('')+'</select>개</label></div>';
}
function bindPager(root, onPage){
  root.querySelectorAll('[data-pg]').forEach(function(b){ b.onclick=function(){ onPage(+b.dataset.pg); root.scrollIntoView({block:'start',behavior:'smooth'}); }; });
  var sel=root.querySelector('[data-size]'); if(sel) sel.onchange=function(){ PG.size=+this.value; try{ localStorage.setItem('hubPageSize',PG.size); }catch(e){} onPage(1); };
}
function marginMin(){ var v=Number(S.config.margin_min&&S.config.margin_min.value); return isFinite(v)&&v>0?v:20; }
function isAdmin(){ return S.me && S.me.role==='관리자'; }

/* ===================== 서버 / 체험 모드 ===================== */
function api(action, body){
  body = body || {}; body.action = action;
  if (DEMO){ var dj = demoApi(body); return dj && dj.error ? Promise.reject({message:dj.error}) : Promise.resolve(dj); }
  body.token = lsGetRaw(LS_TOKEN);
  return fetch(API,{method:'POST',body:JSON.stringify(body),redirect:'follow',cache:'no-store'})
    .then(function(r){ return r.json(); })
    .then(function(j){
      if (j.error==='login'){ lsDel(LS_TOKEN); showLogin('다시 로그인해 주세요'); throw {silent:true}; }
      if (j.error) throw {message:j.error};
      return j;
    }, function(e){ if(e&&e.silent) throw e; throw {message:'서버에 연결할 수 없습니다. 인터넷 연결을 확인하세요'}; });
}
function lsGetRaw(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function fail(e){ if(e&&e.silent) return; var m=(e&&e.message)||'처리 중 오류가 났습니다';
  if (/DriveApp|auth\/drive|권한/.test(m)) m='사진 저장 권한이 아직 없어요. 관리자가 Apps Script에서 hubAuthorize를 실행해 허용한 뒤 새 버전으로 배포해 주세요';
  toast(m,true); }

function demoDb(){
  var d = lsGet(LS_DEMO);
  if (d) return d;
  var t = nowStr(), mk = function(i,o){ return Object.assign({id:'D'+i,sku:'',barcode:'',name:'',brand:'',option:'',corp:'셀렉트인',type:'사입',cost:0,price:0,stock:0,safety:0,loc:'',memo:'',updatedAt:t,updatedBy:'체험'},o); };
  d = { products:[
      mk(1,{sku:'SI-RL-001',barcode:'8801234560011',name:'폴로 랄프로렌 케이블 니트',brand:'POLO',option:'네이비 / M',cost:89000,price:139000,stock:14,safety:5,loc:'A-01'}),
      mk(2,{sku:'SI-RL-002',barcode:'8801234560028',name:'폴로 랄프로렌 케이블 니트',brand:'POLO',option:'크림 / L',cost:89000,price:139000,stock:3,safety:5,loc:'A-01'}),
      mk(3,{sku:'SI-AC-010',barcode:'8801234560035',name:'아크네 스튜디오 머플러',brand:'ACNE',option:'그레이',cost:168000,price:219000,stock:0,safety:2,loc:'B-03'}),
      mk(4,{sku:'GS-NB-530',barcode:'8801234560042',name:'뉴발란스 530 스니커즈',brand:'NEW BALANCE',option:'화이트 / 250',corp:'겐더샵',cost:82000,price:99000,stock:22,safety:6,loc:'C-02'}),
      mk(5,{sku:'SI-BT-100',barcode:'8801234560059',name:'보로탈코 바디 파우더',brand:'BOROTALCO',option:'100g',type:'위탁',cost:6900,price:12900,stock:0,safety:0})
    ], history:[
      {at:t,id:'D1',sku:'SI-RL-001',name:'폴로 랄프로렌 케이블 니트',type:'입고',qty:10,after:14,memo:'체험 데이터',by:'체험'},
      {at:t,id:'D4',sku:'GS-NB-530',name:'뉴발란스 530 스니커즈',type:'출고',qty:-2,after:22,memo:'체험 데이터',by:'체험'}
    ], costs:{}, config:{}, users:[{name:'체험 사용자',role:'관리자',active:true,createdAt:t}] };
  lsSet(LS_DEMO,d); return d;
}
function demoApi(b){
  var d = demoDb(), me = {name:'체험 사용자',role:'관리자'}, t = nowStr();
  function save(){ lsSet(LS_DEMO,d); }
  function find(id){ return d.products.filter(function(p){ return p.id===id; })[0]; }
  function clean(p){ return {sku:String(p.sku||'').trim(),barcode:String(p.barcode||'').trim(),name:String(p.name||'').trim(),brand:String(p.brand||'').trim(),option:String(p.option||'').trim(),corp:p.corp==='겐더샵'?'겐더샵':'셀렉트인',type:p.type==='위탁'?'위탁':'사입',cost:+String(p.cost||0).replace(/[^\d.-]/g,'')||0,price:+String(p.price||0).replace(/[^\d.-]/g,'')||0,safety:+String(p.safety||0).replace(/[^\d.-]/g,'')||0,loc:String(p.loc||'').trim(),memo:String(p.memo||'').trim()}; }
  function dup(c,ex){ var hit=d.products.filter(function(p){ return p.id!==ex && ((c.barcode&&p.barcode===c.barcode)||(c.sku&&p.sku===c.sku)); })[0]; return hit?('같은 바코드/상품코드가 이미 있습니다: '+hit.name):''; }
  switch(b.action){
    case 'boot': return {me:me,products:d.products,history:d.history.slice(0,200),config:d.config,users:d.users};
    case 'product_save': {
      var c=clean(b.p); if(!c.name) return {error:'상품명을 입력하세요'};
      var ex=b.p.id&&find(b.p.id), e=dup(c,ex&&ex.id); if(e) return {error:e};
      if(ex){ if(ex.cost!==c.cost){ (d.costs[ex.id]=d.costs[ex.id]||[]).unshift({at:t,before:ex.cost,after:c.cost,by:me.name}); } Object.assign(ex,c,{updatedAt:t,updatedBy:me.name}); save(); return {ok:true,product:ex}; }
      var p=Object.assign({id:'D'+Date.now(),stock:+b.p.stock||0,updatedAt:t,updatedBy:me.name},c); d.products.push(p);
      if(p.stock) d.history.unshift({at:t,id:p.id,sku:p.sku,name:p.name,type:'기초재고',qty:p.stock,after:p.stock,memo:'상품 등록',by:me.name});
      if(p.cost) d.costs[p.id]=[{at:t,before:null,after:p.cost,by:me.name}];
      save(); return {ok:true,product:p};
    }
    case 'product_delete': d.products=d.products.filter(function(p){ return p.id!==b.id; }); save(); return {ok:true};
    case 'products_import': {
      var a=0,u=0,s=0; (b.rows||[]).forEach(function(r){ var c=clean(r); if(!c.name){s++;return;} var ex=d.products.filter(function(p){ return (c.barcode&&p.barcode===c.barcode)||(c.sku&&p.sku===c.sku); })[0];
        if(ex){ Object.keys(c).forEach(function(k){ if(c[k]!==''&&r[k]!==''&&r[k]!=null) ex[k]=c[k]; }); ex.updatedAt=t; u++; }
        else { var st=+r.stock||0; var p=Object.assign({id:'D'+Date.now()+a,stock:st,updatedAt:t,updatedBy:me.name},c); d.products.push(p); a++; if(st) d.history.unshift({at:t,id:p.id,sku:p.sku,name:p.name,type:'기초재고',qty:st,after:st,memo:'엑셀 가져오기',by:me.name}); } });
      save(); return {ok:true,added:a,updated:u,skipped:s,products:d.products};
    }
    case 'stock_move': {
      var p=find(b.id); if(!p) return {error:'상품을 찾을 수 없습니다'};
      if(p.stocMng==='N') return {error:'사방넷에서 「재고관리 사용안함」인 상품이라 입출고를 기록하지 않아요 (가상재고)'};
      var ty={in:'입고',out:'출고',adjust:'실사조정'}[b.type], q=Math.round(+b.qty||0);
      if(ty!=='실사조정'&&q<=0) return {error:'수량을 1 이상 입력하세요'};
      var bef=p.stock, aft=ty==='입고'?bef+q:ty==='출고'?bef-q:q; p.stock=aft; p.updatedAt=t;
      var mv={at:t,id:p.id,sku:p.sku,name:p.name,type:ty,qty:aft-bef,after:aft,memo:b.memo||'',by:me.name}; d.history.unshift(mv); save();
      return {ok:true,product:p,move:mv};
    }
    case 'barcode_set': { var bp=find(b.id); if(!bp) return {error:'상품을 찾을 수 없습니다'}; var du=d.products.filter(function(x){ return x.id!==b.id&&x.barcode===b.barcode; })[0]; if(du) return {error:'이미 다른 상품이 쓰는 바코드예요: '+du.name}; if(bp.sbnPrd){ var o=bp.barPending||bp.barcode; bp.barPending=b.barcode===o?'':o; } bp.barcode=b.barcode; save(); return {ok:true,product:bp}; }
    case 'history': return {history:d.history.filter(function(h){ return !b.id||h.id===b.id; })};
    case 'cost_history': return {costs:d.costs[b.id]||[]};
    case 'config_set': d.config[b.key]={value:String(b.value),at:t,by:me.name}; save(); return {ok:true,config:d.config};
    case 'users': return {users:d.users};
    case 'user_save': { var x=d.users.filter(function(u){ return u.name===b.name; })[0]; if(!x){ if(!/^\d{4,8}$/.test(b.pin||'')) return {error:'새 직원은 숫자 4~8자리 PIN이 필요합니다'}; d.users.push({name:b.name,role:b.role,active:b.active!==false,createdAt:t}); } else { x.role=b.role; x.active=b.active!==false; } save(); return {ok:true,users:d.users}; }
  }
  return {error:'unknown'};
}

/* ===================== 로그인 ===================== */
function showLogin(msg){
  stopCam();
  $('app').innerHTML =
    '<div class="login"><div class="box">'+
    '<img src="../icon-192.png" alt=""><h1>셀렉트인 OPS</h1><p>상품 · 재고 · 원가를 한 곳에서</p>'+
    (API ?
      '<input class="inp" id="lname" placeholder="이름" autocomplete="username">'+
      '<input class="inp" id="lpin" placeholder="PIN (숫자)" type="password" inputmode="numeric" autocomplete="current-password">'+
      '<button class="btn pri" id="lgo">로그인</button><div class="msg" id="lmsg">'+esc(msg||'')+'</div>'+
      '<div class="alt"><button id="ldemo">체험 모드로 둘러보기</button></div>'
    :
      '<div class="demo" style="text-align:left"><i class="ti ti-info-circle"></i><span>아직 서버가 연결되지 않았습니다. <b>체험 모드</b>로 화면을 먼저 써볼 수 있어요. 데이터는 이 기기에만 저장됩니다.</span></div>'+
      '<button class="btn pri" id="ldemo">체험 모드로 시작</button>'
    )+
    '</div></div>';
  if ($('ldemo')) $('ldemo').onclick = function(){ DEMO = true; boot(); };
  if (!API) return;
  var last = lsGet('hubLastName'); if (last) $('lname').value = last;
  ($('lname').value ? $('lpin') : $('lname')).focus();
  function go(){
    var n=$('lname').value.trim(), p=$('lpin').value.trim();
    if(!n||!p){ $('lmsg').textContent='이름과 PIN을 입력하세요'; return; }
    $('lgo').disabled=true; $('lmsg').textContent='';
    fetch(API,{method:'POST',body:JSON.stringify({action:'login',name:n,pin:p}),redirect:'follow'})
      .then(function(r){ return r.json(); })
      .then(function(j){
        if(j.error){ $('lmsg').textContent=j.error; $('lgo').disabled=false; return; }
        try{ localStorage.setItem(LS_TOKEN,j.token); }catch(e){}
        lsSet('hubLastName',n); DEMO=false; boot();
      }, function(){ $('lmsg').textContent='서버에 연결할 수 없습니다'; $('lgo').disabled=false; });
  }
  $('lgo').onclick = go;
  $('lpin').onkeydown = function(e){ if(e.key==='Enter') go(); };
  $('lname').onkeydown = function(e){ if(e.key==='Enter') $('lpin').focus(); };
}
function logout(){
  if (!confirm('로그아웃할까요?')) return;
  lsDel(LS_TOKEN); lsDel(LS_CACHE); DEMO=false; S={me:null,products:[],history:[],config:{},users:[]}; showLogin();
}

/* ===================== 시작 ===================== */
function boot(){
  if (!DEMO && !lsGetRaw(LS_TOKEN)) return showLogin();
  if (!DEMO){ var c = lsGet(LS_CACHE); if (c && c.me){ S = c; shell(); route(); } }
  if (!S.me) $('app').innerHTML = '<div class="login"><div class="box"><p>불러오는 중…</p></div></div>';
  api('boot').then(function(j){
    S = {me:j.me, products:j.products||[], history:j.history||[], config:j.config||{}, users:j.users||[]};
    if (!DEMO) lsSet(LS_CACHE,S);
    shell(); route();
  }).catch(fail);
}
function persist(){ if (!DEMO) lsSet(LS_CACHE,S); }

/* ===================== 메뉴 ===================== */
var MENU = [
  {grp:'', items:[{k:'home',t:'홈',ic:'home'}]},
  {grp:'상품 · 재고', items:[
    {k:'products',t:'상품 관리',ic:'package'},

  ['cost','price','stock','safety'].forEach(function(k){ if(o[k]!=null) o[k] = String(o[k]).replace(/[^\d.-]/g,''); });
  return o;
}
function openProduct(id){
  var p = id ? S.products.filter(function(x){ return x.id===id; })[0] : null;
  if (id && !p) return toast('상품을 찾을 수 없어요',true);
  if (!p){
    drawer('상품 등록', productForm(null), '<button class="btn" onclick="closeDrawer()">취소</button><button class="btn pri" id="psave">등록</button>');
    bindProductForm(); $('pform').name.focus();
    $('psave').onclick = function(){ saveProduct(null, this); };
    return;
  }
  drawer(esc(p.name),
    '<div class="tabs2" id="dtabs"><button data-t="info" class="on">기본 정보</button><button data-t="hist">재고 이력</button><button data-t="costh">원가 변동</button></div>'+
    '<div id="dtab"></div>',
    '<button class="btn dng'+(isAdmin()?'':' hide')+'" id="pdel" style="margin-right:auto"><i class="ti ti-trash"></i>삭제</button>'+(p.sbnPrd?'':'<button class="btn" id="preg"><i class="ti ti-cloud-upload"></i>사방넷 등록</button>')+'<a class="btn" href="#stock?id='+esc(p.id)+'" onclick="closeDrawer()"><i class="ti ti-barcode"></i>입출고</a><button class="btn pri" id="psave">저장</button>');
  if ($('preg')) $('preg').onclick = function(){ openReg(p.id); };
  var tab = function(t){
    document.querySelectorAll('#dtabs button').forEach(function(b){ b.classList.toggle('on', b.dataset.t===t); });
    $('dft').classList.toggle('hide', t!=='info');
    if (t==='info'){
      $('dtab').innerHTML =
        '<div class="sel" style="margin:0 0 18px;display:flex;gap:14px;align-items:center">'+thumb(p,true)+'<div style="flex:1;min-width:0"><div class="stk" style="margin:0">'+(isVirtual(p)?'가상재고 <b class="num">'+won(p.vstock||0)+'</b>':'현재고 <b class="num">'+(p.type==='위탁'?'—':won(p.stock))+'</b>')+' '+stockPill(p)+sbnPill(p)+'</div>'+'<div class="sbn" style="margin-top:4px">재고 방식: <b>'+stockMode(p)+'</b> · '+(p.sbnPrd?'사방넷 '+esc(p.sbnPrd)+'-'+esc(p.sbnSku)+' '+(isVirtual(p)?'가상재고':'현재고')+'와 연결 (동기화 때 사방넷 값으로 맞춤)':'사방넷 연결 없음 · 앱 입출고로만 관리')+'</div>'+(p.sbnPrd?'<div class="sbn" style="margin-top:4px">'+sbnLabel(p)+(p.cat?' · '+esc(p.cat):'')+'</div>':'')+'<div class="sbn">수정 '+esc(p.updatedAt||'')+' · '+esc(p.updatedBy||'')+'</div></div></div>'+
        productForm(p);
      bindProductForm();
    } else if (t==='hist'){
      $('dtab').innerHTML = '<div class="empty">불러오는 중…</div>';
      api('history',{id:p.id}).then(function(j){ $('dtab').innerHTML = histList(j.history,'재고 이력이 없어요'); }).catch(fail);
    } else {
      $('dtab').innerHTML = '<div class="empty">불러오는 중…</div>';
      api('cost_history',{id:p.id}).then(function(j){
        $('dtab').innerHTML = j.costs.length ? '<div class="list">'+j.costs.map(function(c){
          var up = c.before!=null && c.after>c.before;
          return '<div class="li"><div class="m"><div class="t num">'+(c.before==null?'최초 등록':won(c.before)+'원 → ')+(c.before==null?' '+won(c.after)+'원':won(c.after)+'원')+'</div><div class="s">'+esc(c.at)+' · '+esc(c.by)+'</div></div>'+
            (c.before!=null?'<div class="e"><span class="pill '+(up?'r':'g')+'">'+(up?'▲ ':'▼ ')+won(Math.abs(c.after-c.before))+'</span></div>':'')+'</div>';
        }).join('')+'</div>' : '<div class="empty">원가 변동 기록이 없어요</div>';
      }).catch(fail);
    }
  };
  document.querySelectorAll('#dtabs button').forEach(function(b){ b.onclick = function(){ stopCam(); tab(b.dataset.t); }; });
  tab('info');
  $('psave').onclick = function(){ saveProduct(p.id, this); };
  $('pdel').onclick = function(){
    if (!confirm('「'+p.name+'」 상품을 삭제할까요?\n재고 이력은 시트에 남습니다.')) return;
    api('product_delete',{id:p.id}).then(function(){ S.products = S.products.filter(function(x){ return x.id!==p.id; }); persist(); closeDrawer(); toast('삭제했어요'); shell(); route(); }).catch(fail);
  };
}
function saveProduct(id, btn){
  var d = formData($('pform')); if (id) d.id = id;
  if (!d.name.trim()) return toast('상품명을 입력하세요',true);
  btn.disabled = true;
  api('product_save',{p:d}).then(function(j){
    var i = S.products.findIndex(function(x){ return x.id===j.product.id; });
    if (i>=0) S.products[i] = j.product; else S.products.push(j.product);
    if (!id && j.product.stock) S.history.unshift({at:nowStr(),id:j.product.id,sku:j.product.sku,name:j.product.name,type:'기초재고',qty:j.product.stock,after:j.product.stock,memo:'상품 등록',by:S.me.name});
    persist(); closeDrawer(); toast(id?'저장했어요':'상품을 등록했어요'); shell(); route();
  }).catch(function(e){ btn.disabled=false; fail(e); });
}

/* ---------- 엑셀 붙여넣기 ---------- */
var IMPORT_COLS = {name:['상품명','품명','제품명'],brand:['브랜드'],option:['옵션','옵션명','색상/사이즈'],barcode:['바코드','barcode'],sku:['상품코드','sku','자체상품코드','품번'],corp:['법인'],type:['구분','사입/위탁'],cost:['원가','사입가','매입가'],price:['판매가','소비자가','판매가격'],stock:['재고','수량','재고수량'],safety:['안전재고'],loc:['위치','보관위치','로케이션'],memo:['메모','비고']};
function parsePaste(text){
  var lines = text.replace(/\r/g,'').split('\n').filter(function(l){ return l.trim(); });
  if (lines.length<2) return {error:'제목 행과 상품 행을 함께 붙여넣어 주세요'};
  var sep = lines[0].indexOf('\t')>=0 ? '\t' : ',';
  var head = lines[0].split(sep).map(function(h){ return h.trim().toLowerCase(); });
  var map = {};
  Object.keys(IMPORT_COLS).forEach(function(k){ head.forEach(function(h,i){ if(IMPORT_COLS[k].some(function(n){ return h===n.toLowerCase(); }) && map[k]==null) map[k]=i; }); });
  if (map.name==null) return {error:'제목 행에 「상품명」 칸이 필요해요'};
  var rows = lines.slice(1).map(function(l){ var c=l.split(sep), o={}; Object.keys(map).forEach(function(k){ o[k]=(c[map[k]]||'').trim(); }); return o; }).filter(function(o){ return o.name; });
  return {rows:rows, found:Object.keys(map)};
}
function openImport(){
  var names = {name:'상품명',brand:'브랜드',option:'옵션',barcode:'바코드',sku:'상품코드',corp:'법인',type:'구분',cost:'원가',price:'판매가',stock:'재고',safety:'안전재고',loc:'위치',memo:'메모'};
  drawer('엑셀에서 상품 가져오기',
    '<p style="margin:0 0 12px;color:var(--sub);font-size:14px">엑셀·구글시트에서 <b>제목 행까지 함께</b> 복사해서 아래에 붙여넣으세요. 바코드나 상품코드가 같은 상품은 새로 만들지 않고 정보만 고칩니다 (재고 수량은 바꾸지 않음).</p>'+
    '<div style="background:var(--bg);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--sub);margin-bottom:12px">쓸 수 있는 제목: '+Object.keys(names).map(function(k){ return '<span class="pill" style="margin:2px">'+names[k]+'</span>'; }).join('')+'<div style="margin-top:6px"><button class="btn sm" id="itpl"><i class="ti ti-download"></i>빈 양식 받기</button></div></div>'+
    '<textarea class="inp num" id="itext" style="min-height:180px" placeholder="상품명	브랜드	옵션	바코드	원가	판매가	재고"></textarea>'+
    '<div id="iprev" style="margin-top:12px"></div>',
    '<button class="btn" onclick="closeDrawer()">취소</button><button class="btn pri" id="igo" disabled>가져오기</button>');
  var parsed = null;
  $('itext').oninput = function(){
    parsed = this.value.trim() ? parsePaste(this.value) : null;
    if (!parsed){ $('iprev').innerHTML=''; $('igo').disabled=true; return; }
    if (parsed.error){ $('iprev').innerHTML='<div class="demo" style="margin:0;background:var(--redbg);color:var(--red)">'+esc(parsed.error)+'</div>'; $('igo').disabled=true; return; }
    $('iprev').innerHTML = '<div class="sel" style="margin:0"><div class="nm">'+won(parsed.rows.length)+'개 상품을 찾았어요</div><div class="meta">인식한 칸: '+parsed.found.map(function(k){ return names[k]; }).join(', ')+'</div>'+
      '<div class="meta" style="margin-top:8px">'+parsed.rows.slice(0,3).map(function(r){ return '· '+esc(r.name)+(r.option?' ('+esc(r.option)+')':''); }).join('<br>')+(parsed.rows.length>3?'<br>…':'')+'</div></div>';
    $('igo').disabled = !parsed.rows.length;
  };
  $('itpl').onclick = function(){
    var csv = '﻿'+Object.keys(names).map(function(k){ return names[k]; }).join(',')+'\n';
    var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download = '셀렉트인_상품등록_양식.csv'; a.click();
  };
  $('igo').onclick = function(){
    var b = this; b.disabled = true; b.textContent = '가져오는 중…';
    api('products_import',{rows:parsed.rows}).then(function(j){
      S.products = j.products; persist(); closeDrawer();
      toast('새로 등록 '+j.added+'개 · 정보 수정 '+j.updated+'개'+(j.skipped?' · 건너뜀 '+j.skipped+'개':''));
      if (!DEMO) boot(); else { shell(); route(); }
    }).catch(function(e){ b.disabled=false; b.textContent='가져오기'; fail(e); });
  };
}

  $('sqty').onkeydown = function(e){ if(e.key==='Enter') $('sgo').click(); };

var moving = false;
function commitMove(qty, memo){
  if (moving) return; moving = true;
  if ($('sgo')) $('sgo').disabled = true;
  api('stock_move',{id:MV.id,type:MV.type,qty:qty,memo:memo||''}).then(function(j){
    moving = false;
    var i = S.products.findIndex(function(x){ return x.id===j.product.id; }); if (i>=0) S.products[i] = j.product;
    S.history.unshift(j.move); persist();
    toast((j.move.type)+' 저장 · '+j.product.name+' → 재고 '+won(j.product.stock));
    if (navigator.vibrate) navigator.vibrate(40);
    if ($('shist')) $('shist').innerHTML = histList(S.history.slice(0,30),'');
    MV.id = null; if ($('ssel')) $('ssel').innerHTML='';
    if ($('sq') && !CAM.on && window.innerWidth>900) $('sq').focus();
    var nav = document.querySelector('.side a[data-k="stock"]'); if (nav){ var c=nav.querySelector('.cnt'); var n=lowCount(); if(c){ if(n) c.textContent=n; else c.remove(); } }
  }).catch(function(e){ moving = false; if ($('sgo')) $('sgo').disabled=false; fail(e); });
}

var CAM = {on:false, stream:null, raf:null, zx:null, last:'', lastAt:0};
function startScan(box, onCode, onEnd){
  stopCam();
  box.innerHTML = '<div class="cam"><video id="cv" playsinline muted></video><div class="aim"></div></div><div class="cammsg" id="cmsg">바코드를 네모 안에 맞춰주세요</div>';
  CAM.on = true;
  var video = $('cv');
  var handle = function(code){
    var t = Date.now(); if (code===CAM.last && t-CAM.lastAt<1800) return; CAM.last=code; CAM.lastAt=t;
    var r = onCode(code);
    if (r!=='continue'){ stopCam(); box.innerHTML=''; if (onEnd) onEnd(); }
  };
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ $('cmsg').textContent='이 브라우저에서는 카메라를 쓸 수 없어요. 바코드 번호를 직접 입력하세요'; CAM.on=false; return; }
  if ('BarcodeDetector' in window){
    navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}).then(function(st){
      if (!CAM.on){ st.getTracks().forEach(function(t){t.stop();}); return; }
      CAM.stream = st; video.srcObject = st; video.play();
      var det = new BarcodeDetector({formats:['ean_13','ean_8','code_128','code_39','upc_a','upc_e','qr_code','itf']});
      var tick = function(){
        if (!CAM.on) return;
        if (video.readyState>=2) det.detect(video).then(function(r){ if(r.length) handle(r[0].rawValue); }).catch(function(){});
        CAM.raf = setTimeout(tick, 250);
      };
      tick();
    }).catch(camErr);
  } else {
    loadZX().then(function(){
      if (!CAM.on) return;
      CAM.zx = new ZXing.BrowserMultiFormatReader();
      CAM.zx.decodeFromConstraints({video:{facingMode:'environment'}}, video, function(res){ if (res) handle(res.getText()); }).catch(camErr);
    }).catch(function(){ if($('cmsg')) $('cmsg').textContent='바코드 인식 기능을 불러오지 못했어요. 번호를 직접 입력하세요'; });
  }
}
/* 전체 화면 스캐너 — 바코드 칸·입출고 어디서나 같은 화면 */
function openScanner(title, onCode){
  closeScanner();
  var ov = document.createElement('div'); ov.className='scanov'; ov.id='scanov';
  ov.innerHTML = '<div class="sh"><b>'+esc(title)+'</b><button id="scx" aria-label="닫기"><i class="ti ti-x"></i></button></div>'+
    '<div class="sb" id="scbox"></div>'+
    '<div class="sf"><input id="scin" inputmode="numeric" placeholder="안 읽히면 번호 직접 입력"><button id="scok">확인</button></div>';
  document.body.appendChild(ov);
  $('scx').onclick = closeScanner;
  var manual = function(){ var v=$('scin').value.trim(); if(!v) return; $('scin').value=''; var r=onCode(v); if(r!=='continue') closeScanner(); };
  $('scok').onclick = manual; $('scin').onkeydown = function(e){ if(e.key==='Enter') manual(); };
  startScan($('scbox'), onCode, closeScanner);
}
function closeScanner(){ stopCam(); var o=$('scanov'); if(o) o.remove(); }
function camErr(){ if ($('cmsg')) $('cmsg').textContent = '카메라를 열 수 없어요. 브라우저 설정에서 카메라 권한을 허용해 주세요'; CAM.on=false; }
function loadZX(){
  if (window.ZXing) return Promise.resolve();
  return new Promise(function(ok,no){ var s=document.createElement('script'); s.src='https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js'; s.onload=ok; s.onerror=no; document.head.appendChild(s); });
}
function stopCam(){
  CAM.on = false;
  if (CAM.raf){ clearTimeout(CAM.raf); CAM.raf=null; }
  if (CAM.stream){ CAM.stream.getTracks().forEach(function(t){ t.stop(); }); CAM.stream=null; }
  if (CAM.zx){ try{ CAM.zx.reset(); }catch(e){} CAM.zx=null; }
}

function resizeImage(file, max){
  return new Promise(function(ok,no){
    var img = new Image(), url = URL.createObjectURL(file);
    img.onload = function(){
      var w=img.naturalWidth, h=img.naturalHeight, k=Math.min(1, max/Math.max(w,h));
      var c=document.createElement('canvas'); c.width=Math.round(w*k); c.height=Math.round(h*k);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url);
      ok(c.toDataURL('image/jpeg',0.86).split(',')[1]);
    };
    img.onerror = function(){ no({message:'사진을 읽을 수 없어요'}); };
    img.src = url;
  });
}

var BF = {tab:'auto', q:'', stock:true, corp:'all', page:1};
function barKind(p){
  var b = String(p.barcode||'');
  if (!/^[0-9A-Za-z\-]{8,40}$/.test(b)) return 'odd';
  if (/^21\d{11}$/.test(b)) return 'auto';
  return 'ok';
}
function barGroups(){
  var P = S.products.filter(function(p){ return p.sbnPrd; }), m = {};
  P.forEach(function(p){ if(p.barcode) (m[p.barcode]=m[p.barcode]||[]).push(p); });
  var dup = {}; Object.keys(m).forEach(function(k){ if(m[k].length>1) m[k].forEach(function(p){ dup[p.id]=1; }); });
  return {
    auto: P.filter(function(p){ return !p.barPending && barKind(p)==='auto'; }),
    dup: P.filter(function(p){ return !p.barPending && dup[p.id]; }).sort(function(a,b){ return a.barcode.localeCompare(b.barcode); }),
    odd: P.filter(function(p){ return !p.barPending && barKind(p)==='odd'; }),
    pending: S.products.filter(function(p){ return p.barPending; })
  };
}

    if ($('bsx')) $('bsx').onclick = function(){

      busy(b,true,'내보내는 중…');
      api('barsheet_export',{ids:L.map(function(p){ return p.id; })}).then(function(j){
        try{ localStorage.setItem('hubBarSheetUrl', j.url); }catch(e){}
        busy(b,false); toast(won(j.n)+'개를 시트로 내보냈어요'); window.open(j.url,'_blank'); route();
      }).catch(function(e){ busy(b,false); fail(e); });
    };
    if ($('bsm')) $('bsm').onclick = function(){
      var b=this; busy(b,true,'맞추는 중…');
      api('barsheet_match',{}).then(function(j){ busy(b,false); toast('자동으로 채움 '+won(j.filled)+'개'+(j.multi?' · 후보 여러 개 '+won(j.multi)+'개(직접 확인)':'')+' — 시트에서 확인 후 [시트 내용 반영]을 누르세요'); }).catch(function(e){ busy(b,false); fail(e); });
    };
    if ($('bsa')) $('bsa').onclick = function(){

      busy(b,true,'반영하는 중…');
      api('barsheet_apply',{}).then(function(j){
        busy(b,false); toast('반영 '+won(j.applied)+'개'+(j.failed?' · 오류 '+won(j.failed)+'개(시트 결과 칸 확인)':'')+' → 사방넷 반영 대기');
        BF.tab='pending'; boot();
      }).catch(function(e){ busy(b,false); fail(e); });
    };
    draw();
  }
};
function scanFix(id, after){
  var p = S.products.filter(function(x){ return x.id===id; })[0]; if (!p) return;
  openScanner('새 바코드 스캔 · '+p.name.slice(0,18)+(p.option?' ('+p.option+')':''), function(code){
    if (code===p.barcode){ toast('지금 바코드와 같아요'); return 'stop'; }
    if (navigator.vibrate) navigator.vibrate(40);
    api('barcode_set',{id:id, barcode:code}).then(function(j){
      var i=S.products.findIndex(function(x){ return x.id===id; }); if(i>=0) S.products[i]=j.product; persist();
      toast('바코드 저장 · '+code+' → 사방넷 반영 대기');
      if (after) after(); else route();
    }).catch(fail);
    return 'stop';
  });
}

      '</div><p style="margin:12px 0 0;font-size:13px;color:var(--mute)">직원은 이름 + 숫자 PIN으로 로그인해요. 퇴사자는 「사용 중지」하면 바로 접속이 막힙니다.</p></div>'+

        '<label class="fld"><span>마진율 기준 (%) — 이보다 낮으면 빨간색으로 표시</span><div class="scanrow"><input class="inp r num" id="mmin" inputmode="numeric" value="'+marginMin()+'"><button class="btn" id="msave">저장</button></div></label>'+
        '<div style="font-size:13px;color:var(--mute)">서버: '+(DEMO?'체험 모드 (이 기기에만 저장)':'연결됨')+' · 버전 '+APP_BUILD+'</div>'+

      '</div></div>'+
      '<div class="card" style="margin-top:16px"><h2>사방넷 동기화 <small>'+(S.config.sbn_sync?esc(S.config.sbn_sync.at)+' · '+esc(S.config.sbn_sync.value):'아직 기록 없음')+'</small></h2>'+
      '<p style="margin:0;color:var(--sub);font-size:14px">사방넷 단품(옵션) 목록을 이미지·사방넷 상품코드·단품코드·바코드·원가·판매가·현재고와 함께 가져옵니다. 같은 사방넷 코드는 새로 만들지 않고 갱신하며, 재고는 사방넷 현재고로 맞춰집니다. 지금은 Claude가 사방넷에 로그인된 화면에서 가져오고, 사방넷 API 연결 후에는 자동으로 바뀝니다.</p></div>';

  bind: function(){

    $('uadd').onclick = function(){ userForm(null); };
    document.querySelectorAll('[data-u]').forEach(function(b){ b.onclick=function(){ userForm(S.users.filter(function(u){ return u.name===b.dataset.u; })[0]); }; });
    $('msave').onclick = function(){
      var v = +$('mmin').value; if (!(v>0&&v<100)) return toast('1~99 사이로 넣어주세요',true);
      api('config_set',{key:'margin_min',value:String(v)}).then(function(j){ S.config=j.config; persist(); toast('저장했어요'); }).catch(fail);

function renameMe(){
  drawer('내 이름 바꾸기',
    '<label class="fld"><span>새 이름 <em>*</em></span><input class="inp" id="rn" placeholder="로그인할 때 쓸 이름" value=""></label>'+
    '<label class="fld"><span>현재 PIN <em>*</em></span><input class="inp num" id="rp" type="password" inputmode="numeric" autocomplete="current-password"></label>'+
    '<p style="font-size:13px;color:var(--mute);margin:0">PIN은 그대로예요. 지금까지 입출고·수정 기록의 작업자 이름도 새 이름으로 바뀌어요.</p>',
    '<button class="btn" onclick="closeDrawer()">취소</button><button class="btn pri" id="rgo">바꾸기</button>');
  $('rgo').onclick = function(){
    var b=this, nn=$('rn').value.trim(), pin=$('rp').value.trim();
    if(!nn) return toast('새 이름을 입력하세요',true); if(!pin) return toast('현재 PIN을 입력하세요',true);
    b.disabled=true;
    api('user_rename',{newName:nn,pin:pin}).then(function(j){ try{ localStorage.setItem(LS_TOKEN,j.token); }catch(e){} closeDrawer(); toast('이름을 「'+j.name+'」(으)로 바꿨어요'); boot(); }).catch(function(e){ b.disabled=false; fail(e); });
  };
}
function userForm(u){
  drawer(u?'직원 정보 수정':'직원 추가',
    '<label class="fld"><span>이름 <em>*</em></span><input class="inp" id="un" value="'+esc(u?u.name:'')+'"'+(u?' disabled':'')+' placeholder="로그인할 때 쓰는 이름"></label>'+
    '<label class="fld"><span>권한</span><select class="inp" id="ur"><option'+(u&&u.role==='관리자'?'':' selected')+'>직원</option><option'+(u&&u.role==='관리자'?' selected':'')+'>관리자</option></select></label>'+
    '<label class="fld"><span>PIN (숫자 4~8자리)'+(u?' — 바꿀 때만 입력':' <em>*</em>')+'</span><input class="inp num" id="up" inputmode="numeric" placeholder="'+(u?'비워두면 그대로':'예) 1234')+'"></label>'+
    (u?'<label style="display:flex;gap:8px;align-items:center;font-size:15px"><input type="checkbox" id="ua"'+(u.active?' checked':'')+'> 사용 (끄면 로그인 불가)</label>':''),
    '<button class="btn" onclick="closeDrawer()">취소</button><button class="btn pri" id="usave">저장</button>');
  $('usave').onclick = function(){
    var b=this, name=$('un').value.trim(); if(!name) return toast('이름을 입력하세요',true);
    b.disabled = true;
    api('user_save',{name:name,role:$('ur').value,pin:$('up').value.trim(),active:u?$('ua').checked:true}).then(function(j){ S.users=j.users; persist(); closeDrawer(); toast('저장했어요'); route(); }).catch(function(e){ b.disabled=false; fail(e); });
  };
}

/* ===================== 사방넷 → 앱 데이터 수신 ===================== */
var SBN_ORIGIN = 'https://sbadmin11.sabangnet.co.kr', SBN_IN = null;
window.addEventListener('message', function(e){
  if (e.origin !== SBN_ORIGIN || !e.data || typeof e.data !== 'object') return;
  var d = e.data;
  if (d.type === 'sbn_ping'){ e.source.postMessage({type:'hub_ready', admin:isAdmin()}, SBN_ORIGIN); return; }
  if (d.type !== 'sbn_rows' || !Array.isArray(d.rows)) return;
  if (!SBN_IN || SBN_IN.batch !== d.batch) SBN_IN = {batch:d.batch, rows:[], total:d.total, mode:d.mode==='flags'?'flags':'full'};
  SBN_IN.rows = SBN_IN.rows.concat(d.rows);
  e.source.postMessage({type:'hub_got', n:SBN_IN.rows.length}, SBN_ORIGIN);
  if (d.final) (SBN_IN.mode==='flags' ? openSbnFlags : openSbnImport)();
});
function openSbnFlags(){
  if (!S.me) return;
  if (!isAdmin()) return toast('사방넷 동기화는 관리자만 할 수 있어요',true);
  var R = SBN_IN.rows, y = R.filter(function(r){ return r.stocMng==='Y'; }).length, n = R.filter(function(r){ return r.stocMng==='N'; }).length;
  drawer('사방넷 재고관리 구분 가져오기',
    '<div class="sel" style="margin:0"><div class="nm">단품 '+won(R.length)+'개를 받았어요</div><div class="meta">재고관리 사용함 <b>'+won(y)+'</b> · 사용안함(가상재고) <b>'+won(n)+'</b></div></div>'+
    '<ul class="plan" style="padding-left:20px;margin:16px 0 0"><li>앱 상품의 <b>재고관리 여부·가상재고 수량</b>만 바꿔요 (상품명·바코드·원가·재고 수량은 그대로)</li><li>사용안함 상품은 <b>가상재고</b>로 표시 — 입출고·품절 경고에서 빠져요</li></ul>'+
    '<div class="preview" id="sbnmsg">아래 [반영]을 누르면 시작해요</div>',
    '<button class="btn" onclick="closeDrawer()">취소</button><button class="btn pri" id="sbngo">반영</button>');
  $('sbngo').onclick = function(){
    var b=this; b.disabled=true; $('sbnmsg').textContent='저장 중…';
    api('sbn_flags',{rows:R.map(function(r){ return {sbnPrd:r.sbnPrd,sbnSku:r.sbnSku,stocMng:r.stocMng,vstock:r.vstock,owner:r.owner||''}; })}).then(function(j){
      $('sbnmsg').innerHTML='완료 · 재고관리 <b>'+won(j.y)+'</b> · 가상재고 <b>'+won(j.n)+'</b> · 앱에 없는 단품 '+won(j.missing)+'개'+(j.ownerSet?' · 담당자 채움 '+won(j.ownerSet)+'개':'')+(j.byCorp?'<br>'+Object.keys(j.byCorp).map(function(c){ var o=j.byCorp[c]; return esc(c)+' 재고관리 '+won(o.y)+' / 가상재고 '+won(o.n); }).join('<br>'):'');
      b.textContent='닫기'; b.disabled=false; b.onclick=function(){ closeDrawer(); boot(); };
    }).catch(function(e){ b.disabled=false; fail(e); });
  };
}
function openSbnImport(){
  if (!S.me) return;
  if (!isAdmin()) return toast('사방넷 동기화는 관리자만 할 수 있어요',true);
  var R = SBN_IN.rows, prds = {}; R.forEach(function(r){ prds[r.sbnPrd]=1; });
  var withImg = R.filter(function(r){ return r.img; }).length, mY = R.filter(function(r){ return r.stocMng==='Y'; }).length, mN = R.filter(function(r){ return r.stocMng==='N'; }).length;
  drawer('사방넷에서 상품 가져오기',
    '<div class="sel" style="margin:0"><div class="nm">단품 '+won(R.length)+'개 · 상품 '+won(Object.keys(prds).length)+'개를 받았어요</div>'+
    '<div class="meta">이미지 있는 단품 '+won(withImg)+'개 · 사방넷 상품코드·단품코드·바코드·원가·판매가·현재고 포함</div>'+(mY+mN?'<div class="meta">재고관리 사용함 <b>'+won(mY)+'</b>개 · 사용안함(가상재고) <b>'+won(mN)+'</b>개</div>':'')+'</div>'+
    '<ul class="plan" style="padding-left:20px;margin:16px 0 0"><li>같은 사방넷 코드(또는 바코드) 상품은 <b>갱신</b>, 없으면 <b>새로 등록</b></li><li>재고는 <b>사방넷 현재고로 맞춤</b> — 차이는 재고 이력에 「사방넷동기화」로 남아요</li><li>사방넷 <b>재고관리 사용안함</b> 상품은 가상재고로 표시 — 입출고·품절 경고·자동 반영에서 제외</li><li>앱에서 넣은 보관 위치·메모는 그대로 유지</li></ul>'+
    '<div class="prog"><i id="sbnbar"></i></div><div class="preview" id="sbnmsg">아래 [가져오기]를 누르면 시작해요</div>',
    '<button class="btn" onclick="closeDrawer()">취소</button><button class="btn pri" id="sbngo">가져오기</button>');
  $('sbngo').onclick = function(){
    var b=this; b.disabled=true;
    var size=3000, parts=[], i; for(i=0;i<R.length;i+=size) parts.push(R.slice(i,i+size));
    var tot={added:0,updated:0,stockChanged:0,mngY:0,mngN:0}, k=0;
    var next=function(){
      if (k>=parts.length){ $('sbnmsg').innerHTML='완료 · 새로 등록 <b>'+won(tot.added)+'</b> · 갱신 <b>'+won(tot.updated)+'</b> · 재고 변경 <b>'+won(tot.stockChanged)+'</b>'+(tot.mngY+tot.mngN?'<br>재고관리 사용함 <b>'+won(tot.mngY)+'</b> · 가상재고 <b>'+won(tot.mngN)+'</b>':''); b.textContent='닫기'; b.disabled=false; b.onclick=function(){ closeDrawer(); boot(); }; return; }
      $('sbnmsg').textContent='저장 중… '+(k+1)+' / '+parts.length;
      api('sbn_sync',{rows:parts[k]}).then(function(j){ tot.added+=j.added; tot.updated+=j.updated; tot.stockChanged+=j.stockChanged; tot.mngY+=j.mngY||0; tot.mngN+=j.mngN||0; k++; $('sbnbar').style.width=(k/parts.length*100)+'%'; next(); })
        .catch(function(e){ b.disabled=false; fail(e); $('sbnmsg').textContent='중간에 멈췄어요. [가져오기]를 다시 누르면 이어서 갱신돼요'; parts=parts.slice(k); k=0; });
    };
    next();
  };
}

(function start(){
  // 서버 주소가 캐시된 옛 config.js 때문에 비어 보이면 최신본을 직접 다시 읽음
  if (API) return boot();
  fetch('config.js?v='+Date.now(),{cache:'no-store'}).then(function(r){ return r.text(); }).then(function(t){
    var m = t.match(/HUB_API\s*=\s*'([^']+)'/); if (m) API = m[1].trim();
  }).catch(function(){}).then(boot);
})();
</script>
