<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>셀렉트인 OPS</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b4a35">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="셀렉트인 OPS">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="../icon-192.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">

<style>
:root{
  --bg:#f4f5f7; --card:#fff; --ink:#15171a; --sub:#5b6370; --mute:#8a919c; --line:#e3e6ea; --line2:#d3d8de;
  --brand:#0b4a35; --brand-ink:#fff; --accent:#178a62; --soft:#e8f5ef; --hover:#f0f2f4;
  --red:#c92a2a; --redbg:#fdecec; --amber:#a15c07; --amberbg:#fff4e0; --blue:#1d5fd1; --bluebg:#e9f0fd;
  --radius:12px; --side:236px;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0f1115; --card:#181b21; --ink:#eef0f3; --sub:#a4acb7; --mute:#7c8591; --line:#2a2f37; --line2:#363c46;
    --brand:#7fd1ae; --brand-ink:#0b2a1f; --accent:#4cc795; --soft:#16271f; --hover:#20242b;
    --red:#ff7b7b; --redbg:#3a1d1d; --amber:#f5b454; --amberbg:#2e2414; --blue:#7fb0ff; --bluebg:#18233a; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:15px;line-height:1.55;letter-spacing:-.1px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.num{font-variant-numeric:tabular-nums}
.ti{font-size:20px;line-height:1;vertical-align:-3px}

/* ---------- 레이아웃 ---------- */
.side{position:fixed;inset:0 auto 0 0;width:var(--side);background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:20}
.brand{text-decoration:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:20px 20px 16px;font-weight:700;font-size:17px;color:var(--brand)}
.brand img{width:32px;height:32px;border-radius:8px}
.brand small{display:block;font-weight:500;font-size:12px;color:var(--mute)}
.side nav{flex:1;overflow-y:auto;padding:4px 12px 16px}
.side .grp{font-size:12px;font-weight:600;color:var(--mute);padding:14px 10px 6px}
.side a.it{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;color:var(--sub);text-decoration:none;font-size:15px;font-weight:500}
.side a.it:hover{background:var(--hover);color:var(--ink)}
.side a.it.on{background:var(--soft);color:var(--brand);font-weight:700}
.side a.it .cnt{margin-left:auto;font-size:12px;font-weight:700;background:var(--redbg);color:var(--red);border-radius:99px;padding:1px 8px}
.side a.it .soon{margin-left:auto;font-size:11px;color:var(--mute);font-weight:500}
.side .me{border-top:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:10px;font-size:14px}
.side .me .av{width:32px;height:32px;border-radius:50%;background:var(--soft);color:var(--brand);display:grid;place-items:center;font-weight:700}
.side .me small{display:block;color:var(--mute);font-size:12px}
main{margin-left:var(--side);min-height:100vh;padding:28px 32px 60px}
.wrap{max-width:1120px;margin:0 auto}
.topbar{display:none}
.card.cur{margin-top:14px;box-shadow:none;border:1px solid var(--line)}.card.cur h2 i{color:var(--accent)}.curt{min-width:760px;table-layout:auto!important}.curt td:first-child{width:40%;max-width:360px}.curt td:first-child .c2 b{max-width:340px}
.todo-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:8px}.todo-c{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);cursor:pointer;text-align:left}.todo-c span{font-size:12.5px;color:var(--sub)}.todo-c b{font-size:20px}.todo-c b small{font-size:12px;font-weight:500;margin-left:2px;color:var(--mute)}.todo-c>small{font-size:11.5px;color:var(--accent)}.todo-c.has b{color:var(--amber)}.todo-c.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.todo-list{max-height:320px;overflow:auto;border:1px solid var(--line);border-radius:10px}.todo-r{display:flex;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line)}.todo-r:last-child{border-bottom:0}.todo-r .m{flex:1;min-width:0}.todo-r .t{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.todo-r .s{font-size:12px;color:var(--mute)}.todo-r .e{font-size:13px;white-space:nowrap}.todo-r i{color:var(--mute)}.todo-r.done{opacity:.55}.todo-r.done i{color:var(--accent)}
@media (max-width:900px){.todo-grid{grid-template-columns:1fr 1fr}}

.seg.segwrap{display:flex;flex-wrap:wrap;overflow:visible;max-width:100%;flex:1;min-width:0}.seg.segwrap button{flex:none}
.otabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;position:sticky;top:0;z-index:14;background:var(--bg);padding:10px 0 0;border-bottom:1px solid var(--line);max-width:1120px;margin:0 auto 12px}.otabs::-webkit-scrollbar{display:none}.osync{order:99;margin-left:auto;display:inline-flex;align-items:center;gap:6px;flex:none;align-self:center;margin-bottom:6px;padding:6px 12px;border:1px solid var(--accent);border-radius:8px;background:var(--card);color:var(--accent);font-size:13px;font-weight:700;cursor:pointer}.osync small{font-weight:400;color:var(--mute);font-size:11.5px}.osync.busy i{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.otabs:empty{display:none}
.otab{display:inline-flex;align-items:center;gap:6px;flex:none;padding:8px 10px 8px 12px;border:1px solid var(--line);border-bottom:0;border-radius:9px 9px 0 0;background:var(--bg);font-size:13px;color:var(--sub);text-decoration:none;white-space:nowrap;margin-bottom:-1px}
.otab:hover{background:var(--card)}.otab.on{background:var(--card);color:var(--ink);font-weight:700;box-shadow:0 -1px 0 var(--accent) inset}.otab i{font-size:15px}.otab .cx{font-weight:400;opacity:.45;padding:0 2px;margin-left:2px;border-radius:4px}.otab .cx:hover{opacity:1;background:var(--line)}
@media (max-width:900px){.otabs{position:static;padding:4px 0 0;margin:0 0 8px}.otab{padding:6px 8px 6px 10px;font-size:12.5px}}

.chi{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.chi .m{flex:1;min-width:0}.chi .t{font-weight:600;font-size:14.5px;line-height:1.35}.chi .s{font-size:12.5px;color:var(--mute);margin-top:2px}
.chi .e{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.chf{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}.chf .inp{padding:8px 10px;font-size:13.5px}
.stepper.sm{display:flex;align-items:center;gap:6px}.stepper.sm button{width:30px;height:30px;font-size:16px}.stepper.sm b{min-width:22px;text-align:center}
.chbar{position:sticky;bottom:0;background:var(--card);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 0 calc(4px + env(safe-area-inset-bottom));margin-top:8px;border-top:1px solid var(--line);font-size:14px}
.chsel{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}.chsel>span{width:78px;font-size:13px;font-weight:600;color:var(--sub)}
.chb{border-bottom:1px solid var(--line);padding:10px 0}.chb summary{cursor:pointer;font-size:14px;list-style:none}.chb .s{font-size:12.5px;color:var(--mute)}
.stchk{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin:-4px 0 12px;font-size:14px}.stchk>span{font-size:13px;font-weight:600;color:var(--sub)}.stchk label{display:flex;align-items:center;gap:5px;cursor:pointer}.stchk small{color:var(--mute)}
.ptbl tr.grp.open{background:var(--soft)}.ptbl tr.sub td{background:var(--bg);padding-top:8px;padding-bottom:8px}.subnm{padding-left:56px;font-size:14px}.subnm .sku{font-size:12px;color:var(--mute);margin-right:6px}.optc{color:var(--brand);font-weight:600;white-space:nowrap}.optc i{vertical-align:-2px}
.mcsub{margin:0 0 8px 18px;border-left:2px solid var(--line)}.mcsub .mc{padding-left:12px}
.hopt{font-size:12.5px;color:var(--sub);margin-top:1px}
.pfilters{display:contents}.pfilters .stchk{flex-basis:100%;margin:0}.pfbtn,.pfdone{display:none}.pfn{display:inline-grid;place-items:center;min-width:18px;height:18px;border-radius:9px;background:var(--brand);color:#fff;font-size:11px;margin-left:4px}
@media (max-width:900px){#pscan span,.pfbtn span{display:none}#pscan,.pfbtn{padding-left:12px;padding-right:12px}.pfbtn{display:inline-flex}.pfilters{display:none;width:100%;flex-direction:column;align-items:stretch;gap:10px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}.pfilters.open{display:flex}.pfilters .seg{align-self:flex-start}.pfilters .stchk{margin:0}.pfdone{display:inline-flex;align-self:flex-end}.pfilters #powner{width:100%!important}}
.grpbar{display:flex;align-items:center;justify-content:flex-end;gap:6px;margin:0 0 8px;font-size:13px;color:var(--mute)}.grpbar span{margin-right:auto}
.tabbar{display:none}

.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.ph h1{margin:0;font-size:24px;font-weight:700;letter-spacing:-.5px}
.ph p{margin:4px 0 0;color:var(--sub);font-size:14px}
.ph .acts{display:flex;gap:8px;flex-wrap:wrap}

.demo{display:flex;align-items:center;gap:10px;background:var(--amberbg);color:var(--amber);border-radius:10px;padding:10px 14px;font-size:14px;margin-bottom:18px}
.demo b{font-weight:700}

/* ---------- 공통 요소 ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px}
.card+.card{margin-top:16px}
.grid>.card+.card{margin-top:0}
.card h2{margin:0 0 12px;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:8px}
.card h2 small{font-weight:500;font-size:13px;color:var(--mute)}
.grid{display:grid;gap:16px}
.grid>*{min-width:0}
html,body{max-width:100%;overflow-x:hidden}
.list .li,.todo,.mc{min-width:0}
.list .li .e,.mc .e{max-width:40%}
.g4{grid-template-columns:repeat(4,1fr)}
.salesbars{display:flex;gap:2px;align-items:flex-end;height:110px;margin:12px 0 4px;overflow-x:auto;scrollbar-width:none}.salesbars::-webkit-scrollbar{display:none}.salesbars .sb{flex:1 0 14px;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end}.salesbars .sb i{display:block;width:100%;background:var(--line);border-radius:3px 3px 0 0}.salesbars .sb.on i{background:var(--accent)}.salesbars .sb span{font-size:10px;color:var(--mute);margin-top:2px;white-space:nowrap}
.sbar{position:relative;height:18px;background:var(--bg);border-radius:4px;overflow:hidden}.sbar i{display:block;height:100%;background:var(--accent);opacity:.25}.sbar span{position:absolute;left:6px;top:0;font-size:12px;line-height:18px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;text-decoration:none;color:inherit;display:block}
a.kpi:hover{border-color:var(--line2)}
.kpi{width:100%}
.kpi .k{font-size:13px;color:var(--sub);display:flex;align-items:center;gap:6px}
.kpi .v{font-size:28px;font-weight:700;letter-spacing:-.6px;margin-top:4px}
.kpi .v small{font-size:15px;font-weight:500;color:var(--sub);margin-left:2px}
.kpi.red .v{color:var(--red)} .kpi.amber .v{color:var(--amber)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--line2);background:var(--card);color:var(--ink);font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.dng{color:var(--red);border-color:var(--line2)}
.btn.sm{height:32px;padding:0 10px;font-size:13px;border-radius:8px}
.btn.lg{height:52px;font-size:16px;border-radius:12px;padding:0 22px}
.btn:disabled{opacity:.45;cursor:default}
.btn .ti{font-size:18px}

.fld{display:block;margin-bottom:14px}
.fld>span{display:block;font-size:13px;font-weight:600;color:var(--sub);margin-bottom:6px}
.fld>span em{font-style:normal;color:var(--red)}
.inp,select.inp,textarea.inp{width:100%;height:42px;border:1px solid var(--line2);border-radius:10px;background:var(--card);padding:0 12px;font-size:15px;outline:none}
textarea.inp{height:auto;min-height:96px;padding:10px 12px;resize:vertical;line-height:1.5}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--soft)}
.inp.r{text-align:right}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.optrow{display:grid;grid-template-columns:1fr 1fr 64px 1.5fr 32px;gap:6px;align-items:center;margin-bottom:6px}.obc{display:flex;gap:4px;min-width:0}.obc .inp{min-width:0;flex:1}.oscan{width:38px;flex:none;border:0;border-radius:8px;background:var(--brand);color:#fff;cursor:pointer}
@media (max-width:560px){.optrow{grid-template-columns:1fr 1fr 56px 32px}.optrow .obc{grid-column:1 / span 3;order:5}.optrow .x{order:4}.opthd span:nth-child(4){display:none}}.optrow .inp{padding:10px}.opthd span{font-size:12px;color:var(--mute);padding-left:4px}.optrow .x{width:36px;height:36px;border:0;background:var(--bg);border-radius:8px;cursor:pointer}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 12px}

.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;max-width:100%;overflow-x:auto;scrollbar-width:none}.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;white-space:nowrap;border:0;background:none;padding:6px 12px;border-radius:7px;font-size:14px;color:var(--sub);cursor:pointer;font-weight:500}
.seg button.on{background:var(--card);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}

.search{position:relative;flex:1;min-width:220px}
.search .ti{position:absolute;left:12px;top:11px;color:var(--mute)}
.search .inp{padding-left:40px}

.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:center;font-size:12.5px;font-weight:600;color:var(--sub);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--card);position:sticky;top:0}
.tbl td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--hover)}
.tbl .r{text-align:right}
.tbl .nm{font-weight:600}
.tbl .sm{font-size:12.5px;color:var(--mute)}
.tblwrap{overflow-x:auto;margin:0 -20px;padding:0 20px}
.ktbl{table-layout:fixed;min-width:960px}.ktbl th,.ktbl td{text-align:center!important}.ktbl td .c2{align-items:center}.ktbl th:first-child:not(.c),.ktbl td:first-child:not(.c),.ktbl th.c:first-child+th,.ktbl td.c:first-child+td{text-align:left!important}
.ktbl td:first-child:not(.c) .c2,.ktbl td.c:first-child+td .c2{align-items:flex-start}.krno{color:var(--mute);font-weight:600}.kmap2{text-decoration:none!important;color:inherit}.ktbl td{white-space:nowrap}.ktbl td:first-child{white-space:normal}
.c2{display:flex;flex-direction:column;gap:2px;line-height:1.3;min-width:0}.c2>b{font-weight:700;white-space:nowrap}.c2>span{font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tbl .r .c2{align-items:flex-end}
.nm2>b{overflow:hidden;text-overflow:ellipsis;font-weight:600}.c2 .ell{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.c2 em{font-style:normal;font-weight:600}.c2 em.ok,em.ok{color:var(--accent);font-style:normal}.c2 em.wn,em.wn{color:var(--amber);font-style:normal}
.ktbl tr.sub .subnm{padding-left:28px}.ktbl tr.kmid td{background:var(--soft);padding:10px 12px;white-space:nowrap;border-left:0}.ktbl tr.kmid.open td{background:#e3f1ea}.kmidm.click{cursor:pointer}.kmap{font-size:12px;color:var(--brand);text-decoration:underline}.pick button.on{outline:2px solid var(--accent)}.kmidm{padding:8px 4px 4px;font-size:13px}

.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--bg);color:var(--sub);white-space:nowrap}
.pill.g{background:var(--soft);color:var(--accent)}
.pill.r{background:var(--redbg);color:var(--red)}
.pill.a{background:var(--amberbg);color:var(--amber)}
.pill.b{background:var(--bluebg);color:var(--blue)}

.list .li{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.list .li:first-child{border-top:0;padding-top:4px}
.list .li .m{flex:1;min-width:0}
.list .li .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list .li .s{font-size:13px;color:var(--mute)}
.list .li .e{text-align:right;flex:none}
.empty{color:var(--mute);font-size:14px;padding:18px 0;text-align:center}
.qty{font-weight:700}
.qty.p{color:var(--accent)} .qty.m{color:var(--red)}

.todo{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.todo:first-child{border-top:0;padding-top:2px}
.todo .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--bg);color:var(--sub)}
.todo .ic.ok{background:var(--soft);color:var(--accent)} .todo .ic.warn{background:var(--amberbg);color:var(--amber)} .todo .ic.bad{background:var(--redbg);color:var(--red)}
.todo .m{flex:1;min-width:0}
.todo .t{font-weight:600}
.todo .s{font-size:13px;color:var(--mute)}

.tool{display:flex;gap:14px;align-items:flex-start;padding:16px;border:1px solid var(--line);border-radius:var(--radius);background:var(--card);text-decoration:none;color:inherit}
.tool:hover{border-color:var(--accent)}
.tool .ic{width:42px;height:42px;border-radius:11px;background:var(--soft);color:var(--brand);display:grid;place-items:center;flex:none}
.tool .ic .ti{font-size:22px}
.tool .t{font-weight:700;font-size:15px}
.tool .s{font-size:13px;color:var(--sub);margin-top:2px}
.tool .u{font-size:12px;color:var(--mute);margin-top:6px;word-break:break-all}

.plan li{margin:6px 0;color:var(--sub)}
.plan li b{color:var(--ink);font-weight:600}

/* ---------- 재고 입출고 ---------- */
.mv-type{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.mv-type button{height:56px;border-radius:12px;border:2px solid var(--line);background:var(--card);font-size:16px;font-weight:700;color:var(--sub);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.mv-type button.on.in{border-color:var(--accent);color:var(--accent);background:var(--soft)}
.mv-type button.on.out{border-color:var(--red);color:var(--red);background:var(--redbg)}
.mv-type button.on.adjust{border-color:var(--blue);color:var(--blue);background:var(--bluebg)}
.scanrow{display:flex;gap:8px}
.scanrow .search{min-width:0}
.pick{margin-top:12px;border:1px solid var(--line);border-radius:10px;max-height:280px;overflow-y:auto}
.pick button{display:flex;width:100%;text-align:left;gap:10px;align-items:center;padding:10px 12px;border:0;border-top:1px solid var(--line);background:var(--card);cursor:pointer}
.pick button:first-child{border-top:0}

<script>

/* ===================== 유틸 ===================== */
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function won(n){ n=Number(n)||0; return n.toLocaleString('ko-KR'); }
function lsGet(k){ try{ var s=localStorage.getItem(k); return s?JSON.parse(s):null; }catch(e){ return null; } }

function nowStr(){ var d=new Date(Date.now()+9*36e5); return d.toISOString().slice(0,16).replace('T',' '); }

function toast(msg,err){ var t=document.createElement('div'); t.className='toast'+(err?' err':''); t.textContent=msg; document.body.appendChild(t); setTimeout(function(){ t.remove(); }, err?3600:2200); }
function margin(p){ if(!p.price) return null; return (p.price-p.cost)/p.price*100; }
function isMoum(p){ return !!p.link; }
function isVirtual(p){ return p.stocMng==='N' && !p.link; }
var _PK=null, _PKsrc=null;
function byKey(k){ if(_PKsrc!==S.products){ _PK={}; S.products.forEach(function(p){ if(p.sbnPrd) _PK[p.sbnPrd+'-'+p.sbnSku]=p; }); _PKsrc=S.products; } return _PK[k]; }
function originOf(p){ return p && p.link ? byKey(p.link) : null; }
function stockState(p){ if(p.type==='위탁' || p.sbnStatus==='미사용' || isVirtual(p) || isMoum(p)) return 'na'; if(p.stock<=0) return 'out'; if(p.safety && p.stock<=p.safety) return 'low'; return 'ok'; }
function stockMode(p){ return p.type==='위탁' ? '위탁' : isMoum(p) ? '모음전' : isVirtual(p) ? '가상재고' : '현재고'; }
function stockLink(p){ return p.sbnPrd ? '사방넷 연동' : '앱 단독'; }
function stockCell(p){
  var m = stockMode(p), s = stockState(p);
  var o = m==='모음전' ? originOf(p) : null;
  var top = m==='위탁' ? '<b>—</b>' : m==='가상재고' ? '<b class="vq">'+won(p.vstock||0)+'</b>' : m==='모음전' ? '<b'+(o?'':' class="vq"')+'>'+(o?won(o.stock):'?')+'</b>' : '<b>'+won(p.stock)+'</b>';
  if (m==='모음전') return '<div class="stk2">'+top+'<div><span class="pill b">모음전</span>'+(o&&o.stock<=0?' <span class="pill r">원본 품절</span>':'')+'</div><span class="lk" title="사방넷 연결상품 · 원본 재고를 따라가요">원본 '+esc(p.link)+(o?'':' (앱에 없음)')+'</span></div>';
  var tags = '<span class="pill '+(m==='현재고'?'g':'')+'">'+m+'</span>'+(s==='out'?' <span class="pill r">품절</span>':s==='low'?' <span class="pill a">부족</span>':'');
  return '<div class="stk2">'+top+'<div>'+tags+'</div><span class="lk" title="'+(p.sbnPrd?'사방넷 '+esc(p.sbnPrd)+'-'+esc(p.sbnSku)+' '+(m==='가상재고'?'가상재고':'현재고')+'와 연결 · 사방넷 동기화 때 맞춰져요':'사방넷과 연결되지 않은 상품 · 앱 입출고로만 바뀌어요')+'">'+stockLink(p)+'</span></div>';
}
function stockPill(p){
  var s=stockState(p);
  if(isVirtual(p)) return '<span class="pill">가상재고</span>';
  if(s==='out') return '<span class="pill r">품절</span>';
  if(s==='low') return '<span class="pill a">부족</span>';
  return '';
}
function thumb(p,lg){ var c='th'+(lg?' lg':''); return p.img ? '<img class="'+c+'" loading="lazy" referrerpolicy="no-referrer" src="'+esc(p.img)+'" alt="" onerror="this.removeAttribute(\'src\');this.alt=\'\'">' : '<span class="'+c+'"><i class="ti ti-photo"></i></span>'; }

function sbnPill(p){ return p.sbnStatus && p.sbnStatus!=='판매' && p.sbnStatus!=='공급중' ? ' <span class="pill">'+esc(p.sbnStatus)+'</span>' : ''; }
var PG_SIZES = [10,20,30,50,100,300,500];
var PG = {size: (function(){ var v=+lsGetRaw('hubPageSize'); return PG_SIZES.indexOf(v)>=0?v:50; })()};
function pageSlice(L, page){ var pages=Math.max(1,Math.ceil(L.length/PG.size)); page=Math.min(Math.max(1,page),pages); return L.slice((page-1)*PG.size, page*PG.size); }
function pagerHtml(total, page, size){
  var pages = Math.max(1, Math.ceil(total/size)); page = Math.min(Math.max(1,page),pages);
  var from = total? (page-1)*size+1 : 0, to = Math.min(total, page*size);
  var nums = [], i, lo = Math.max(1, page-2), hi = Math.min(pages, lo+4); lo = Math.max(1, hi-4);
  if (lo>1){ nums.push(1); if(lo>2) nums.push('…'); }
  for(i=lo;i<=hi;i++) nums.push(i);
  if (hi<pages){ if(hi<pages-1) nums.push('…'); nums.push(pages); }
  return '<div class="pager"><div class="cnt">총 <b class="num">'+won(total)+'</b>개 · '+won(from)+'–'+won(to)+'</div>'+
    '<div class="pg"><button data-pg="'+(page-1)+'"'+(page<=1?' disabled':'')+' aria-label="이전"><i class="ti ti-chevron-left"></i></button>'+
    nums.map(function(n){ return n==='…'?'<span>…</span>':'<button data-pg="'+n+'" class="'+(n===page?'on':'')+'">'+n+'</button>'; }).join('')+
    '<button data-pg="'+(page+1)+'"'+(page>=pages?' disabled':'')+' aria-label="다음"><i class="ti ti-chevron-right"></i></button></div>'+
    '<label style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub)">한 페이지에 <select data-size>'+PG_SIZES.map(function(v){ return '<option'+(v===size?' selected':'')+'>'+v+'</option>'; }).join('')+'</select>개</label></div>';
}
function bindPager(root, onPage){
  root.querySelectorAll('[data-pg]').forEach(function(b){ b.onclick=function(){ onPage(+b.dataset.pg); root.scrollIntoView({block:'start',behavior:'smooth'}); }; });
  var sel=root.querySelector('[data-size]'); if(sel) sel.onchange=function(){ PG.size=+this.value; try{ localStorage.setItem('hubPageSize',PG.size); }catch(e){} onPage(1); };
}
function deadNeg(p){ var m=margin(p); return m!==null && m<0 && stockMode(p)!=='위탁' && effStock(p)<=0; }  /* 재고 0 + 역마진: 집계·목록에서 빼고 숨김 */
function marginMin(){ var v=Number(S.config.margin_min&&S.config.margin_min.value); return isFinite(v)&&v>0?v:20; }
function isAdmin(){ return S.me && S.me.role==='관리자'; }

/* ===================== 서버 / 체험 모드 ===================== */
function api(action, body){
  body = body || {}; body.action = action;
  if (DEMO){ var dj = demoApi(body); return dj && dj.error ? Promise.reject({message:dj.error}) : Promise.resolve(dj); }
  body.token = lsGetRaw(LS_TOKEN);
  return fetch(API,{method:'POST',body:JSON.stringify(body),redirect:'follow',cache:'no-store'})
    .then(function(r){ return r.json(); })
    .then(function(j){
      if (j.error==='login'){ lsDel(LS_TOKEN); showLogin('다시 로그인해 주세요'); throw {silent:true}; }

    }, function(e){ if(e&&e.silent) throw e; throw {message:'서버에 연결할 수 없습니다. 인터넷 연결을 확인하세요'}; });
}
function lsGetRaw(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function fail(e){ if(e&&e.silent) return; var m=(e&&e.message)||'처리 중 오류가 났습니다';

var IMPORT_COLS = {name:['상품명','품명','제품명'],brand:['브랜드'],option:['옵션','옵션명','색상/사이즈'],barcode:['바코드','barcode'],sku:['상품코드','sku','자체상품코드','품번'],corp:['법인'],type:['구분','사입/위탁'],cost:['원가','사입가','매입가'],price:['판매가','소비자가','판매가격'],stock:['재고','수량','재고수량'],safety:['안전재고'],loc:['위치','보관위치','로케이션'],memo:['메모','비고']};
function parsePaste(text){
  var lines = text.replace(/\r/g,'').split('\n').filter(function(l){ return l.trim(); });
  if (lines.length<2) return {error:'제목 행과 상품 행을 함께 붙여넣어 주세요'};
  var sep = lines[0].indexOf('\t')>=0 ? '\t' : ',';
  var head = lines[0].split(sep).map(function(h){ return h.trim().toLowerCase(); });
  var map = {};
  Object.keys(IMPORT_COLS).forEach(function(k){ head.forEach(function(h,i){ if(IMPORT_COLS[k].some(function(n){ return h===n.toLowerCase(); }) && map[k]==null) map[k]=i; }); });
  if (map.name==null) return {error:'제목 행에 「상품명」 칸이 필요해요'};
  var rows = lines.slice(1).map(function(l){ var c=l.split(sep), o={}; Object.keys(map).forEach(function(k){ o[k]=(c[map[k]]||'').trim(); }); return o; }).filter(function(o){ return o.name; });
  return {rows:rows, found:Object.keys(map)};
}
function openImport(){

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ $('cmsg').textContent='이 브라우저에서는 카메라를 쓸 수 없어요. 바코드 번호를 직접 입력하세요'; CAM.on=false; return; }
  if ('BarcodeDetector' in window){
    navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}).then(function(st){
      if (!CAM.on){ st.getTracks().forEach(function(t){t.stop();}); return; }
      CAM.stream = st; video.srcObject = st; video.play();
      var det = new BarcodeDetector({formats:['ean_13','ean_8','code_128','code_39','upc_a','upc_e','qr_code','itf']});
      var tick = function(){
        if (!CAM.on) return;
        if (video.readyState>=2) det.detect(video).then(function(r){ if(r.length) handle(r[0].rawValue); }).catch(function(){});
        CAM.raf = setTimeout(tick, 250);

    }).catch(camErr);
  } else {
    loadZX().then(function(){
      if (!CAM.on) return;
      CAM.zx = new ZXing.BrowserMultiFormatReader();

    }).catch(function(){ if($('cmsg')) $('cmsg').textContent='바코드 인식 기능을 불러오지 못했어요. 번호를 직접 입력하세요'; });

}

var KRM_ORIGIN = 'https://partner.kream.co.kr', KRM_IN = {};
window.addEventListener('message', function(e){
  if (e.origin !== KRM_ORIGIN || !e.data || typeof e.data !== 'object') return;

  if (d.type === 'krm_ping'){ if (S.me){ src.postMessage({type:'hub_ready'}, KRM_ORIGIN); krPollStart(); } return; }
  if (d.type !== 'krm_rows' || !S.me) return;
  var B = KRM_IN[d.batch] || (KRM_IN[d.batch] = {got:0, q:Promise.resolve(), tot:{asks:0,salesAdded:0,salesUpdated:0}, err:null});
  B.q = B.q.then(function(){

      if (j.asks!=null) B.tot.asks=j.asks; B.tot.salesAdded+=j.salesAdded||0; B.tot.salesUpdated+=j.salesUpdated||0;
    }).catch(function(x){ B.err = (x&&x.message)||'저장 실패'; });
  }).then(function(){
    B.got++;

});

function barKind(p){
  var b = String(p.barcode||'');
  if (!/^[0-9A-Za-z\-]{8,40}$/.test(b)) return 'odd';
  if (/^21\d{11}$/.test(b)) return 'auto';
  return 'ok';
}
function barGroups(){
  var P = S.products.filter(function(p){ return p.sbnPrd; }), m = {};
  P.forEach(function(p){ if(p.barcode) (m[p.barcode]=m[p.barcode]||[]).push(p); });
  var dup = {}; Object.keys(m).forEach(function(k){ if(m[k].length>1) m[k].forEach(function(p){ dup[p.id]=1; }); });
  return {
    auto: P.filter(function(p){ return !p.barPending && barKind(p)==='auto'; }),
    dup: P.filter(function(p){ return !p.barPending && dup[p.id]; }).sort(function(a,b){ return a.barcode.localeCompare(b.barcode); }),
    odd: P.filter(function(p){ return !p.barPending && barKind(p)==='odd'; }),
    pending: S.products.filter(function(p){ return p.barPending; })
  };
}

  if (!typing && !document.getElementById('ov')) route();   // 입력 중이거나 창이 열려 있으면 화면은 그대로 (다음 이동 때 반영)

/* ===================== 사방넷 → 앱 데이터 수신 ===================== */
var SBN_ORIGIN = 'https://sbadmin11.sabangnet.co.kr', SBN_IN = null;
window.addEventListener('message', function(e){
  if (e.origin !== SBN_ORIGIN || !e.data || typeof e.data !== 'object') return;
  var d = e.data;
  if (d.type === 'sbn_ping'){ e.source.postMessage({type:'hub_ready', admin:isAdmin()}, SBN_ORIGIN); return; }
  if ((d.type==='sbs_rows' || d.type==='sbr_rows' || d.type==='sbk_rows' || d.type==='sbc_rows') && S.me){   // sbn.js: 현재고 자동 맞춤 · 쇼핑몰 등록 현황
    var src=e.source, act=d.type==='sbs_rows'?'sbn_stock_sync':d.type==='sbk_rows'?'sbn_sku_sync':d.type==='sbc_rows'?'sbc_sync':'sbr_sync';
    api(act, d.type==='sbs_rows'?{rows:d.rows, final:true, total:d.rows.length}:d.type==='sbk_rows'?{rows:d.rows, complete:!!d.complete}:{accts:d.accts}).then(function(j){
      if (d.type==='sbc_rows'){ src.postMessage({type:'sbx_saved', batch:d.batch, res:j}, SBN_ORIGIN); SBR=null; if(/^#reg/.test(location.hash||'')) route(); return; }
      src.postMessage({type:'sbx_saved', batch:d.batch, res:j}, SBN_ORIGIN);
      if (d.type==='sbs_rows'||d.type==='sbk_rows'){ if (j.changed){ toast('사방넷 맞춤 · '+j.changed+'곳 변경'); if (!sbnMerge(j)) boot(); } }
      else { SBR=null; if(/^#reg/.test(location.hash||'')) route(); toast('쇼핑몰 등록 현황 '+j.accts+'개 계정 저장'); }
    }).catch(function(x){ src.postMessage({type:'sbx_error', batch:d.batch, message:(x&&x.message)||'저장 실패'}, SBN_ORIGIN); });
    return;
  }
  if (d.type !== 'sbn_rows' || !Array.isArray(d.rows)) return;
  if (!SBN_IN || SBN_IN.batch !== d.batch) SBN_IN = {batch:d.batch, rows:[], total:d.total, mode:d.mode==='flags'?'flags':'full'};
  SBN_IN.rows = SBN_IN.rows.concat(d.rows);
  e.source.postMessage({type:'hub_got', n:SBN_IN.rows.length}, SBN_ORIGIN);
  if (d.final) (SBN_IN.mode==='flags' ? openSbnFlags : openSbnImport)();
});
function openSbnFlags(){
  if (!S.me) return;
  if (!isAdmin()) return toast('사방넷 동기화는 관리자만 할 수 있어요',true);
  var R = SBN_IN.rows, y = R.filter(function(r){ return r.stocMng==='Y'; }).length, n = R.filter(function(r){ return r.stocMng==='N'; }).length;
  drawer('사방넷 재고관리 구분 가져오기',
    '<div class="sel" style="margin:0"><div class="nm">단품 '+won(R.length)+'개를 받았어요</div><div class="meta">재고관리 사용함 <b>'+won(y)+'</b> · 사용안함(가상재고) <b>'+won(n)+'</b></div></div>'+
    '<ul class="plan" style="padding-left:20px;margin:16px 0 0"><li>앱 상품의 <b>재고관리 여부·가상재고 수량</b>만 바꿔요 (상품명·바코드·원가·재고 수량은 그대로)</li><li>사용안함 상품은 <b>가상재고</b>로 표시 — 입출고·품절 경고에서 빠져요</li></ul>'+
    '<div class="preview" id="sbnmsg">아래 [반영]을 누르면 시작해요</div>',
    '<button class="btn" onclick="closeDrawer()">취소</button><button class="btn pri" id="sbngo">반영</button>');
  $('sbngo').onclick = function(){
    var b=this; b.disabled=true; $('sbnmsg').textContent='저장 중…';
    api('sbn_flags',{rows:R.map(function(r){ return {sbnPrd:r.sbnPrd,sbnSku:r.sbnSku,stocMng:r.stocMng,vstock:r.vstock,owner:r.owner||'',cost:r.cost,price:r.price,link:r.link,setDiv:r.setDiv}; })}).then(function(j){
      $('sbnmsg').innerHTML='완료 · 재고관리 <b>'+won(j.y)+'</b> · 가상재고 <b>'+won(j.n)+'</b> · 앱에 없는 단품 '+won(j.missing)+'개'+(j.ownerSet?' · 담당자 채움 '+won(j.ownerSet)+'개':'')+(j.costChanged!=null?'<br>원가 변경 <b>'+won(j.costChanged)+'</b>개 · 판매가 변경 <b>'+won(j.priceChanged)+'</b>개':'')+(j.byCorp?'<br>'+Object.keys(j.byCorp).map(function(c){ var o=j.byCorp[c]; return esc(c)+' 재고관리 '+won(o.y)+' / 가상재고 '+won(o.n); }).join('<br>'):'');
      b.textContent='닫기'; b.disabled=false; b.onclick=function(){ closeDrawer(); boot(); };
    }).catch(function(e){ b.disabled=false; fail(e); });
  };
}
function openSbnImport(){
  if (!S.me) return;
  if (!isAdmin()) return toast('사방넷 동기화는 관리자만 할 수 있어요',true);
  var R = SBN_IN.rows, prds = {}; R.forEach(function(r){ prds[r.sbnPrd]=1; });
  var withImg = R.filter(function(r){ return r.img; }).length, mY = R.filter(function(r){ return r.stocMng==='Y'; }).length, mN = R.filter(function(r){ return r.stocMng==='N'; }).length;
  drawer('사방넷에서 상품 가져오기',
    '<div class="sel" style="margin:0"><div class="nm">단품 '+won(R.length)+'개 · 상품 '+won(Object.keys(prds).length)+'개를 받았어요</div>'+
    '<div class="meta">이미지 있는 단품 '+won(withImg)+'개 · 사방넷 상품코드·단품코드·바코드·원가·판매가·현재고 포함</div>'+(mY+mN?'<div class="meta">재고관리 사용함 <b>'+won(mY)+'</b>개 · 사용안함(가상재고) <b>'+won(mN)+'</b>개</div>':'')+'</div>'+
    '<ul class="plan" style="padding-left:20px;margin:16px 0 0"><li>같은 사방넷 코드(또는 바코드) 상품은 <b>갱신</b>, 없으면 <b>새로 등록</b></li><li>재고는 <b>사방넷 현재고로 맞춤</b> — 차이는 재고 이력에 「사방넷동기화」로 남아요</li><li>사방넷 <b>재고관리 사용안함</b> 상품은 가상재고로 표시 — 입출고·품절 경고·자동 반영에서 제외</li><li>앱에서 넣은 보관 위치·메모는 그대로 유지</li></ul>'+
    '<div class="prog"><i id="sbnbar"></i></div><div class="preview" id="sbnmsg">아래 [가져오기]를 누르면 시작해요</div>',
    '<button class="btn" onclick="closeDrawer()">취소</button><button class="btn pri" id="sbngo">가져오기</button>');
  $('sbngo').onclick = function(){
    var b=this; b.disabled=true;
    var size=3000, parts=[], i; for(i=0;i<R.length;i+=size) parts.push(R.slice(i,i+size));
    var tot={added:0,updated:0,stockChanged:0,mngY:0,mngN:0}, k=0;
    var next=function(){
      if (k>=parts.length){ $('sbnmsg').innerHTML='완료 · 새로 등록 <b>'+won(tot.added)+'</b> · 갱신 <b>'+won(tot.updated)+'</b> · 재고 변경 <b>'+won(tot.stockChanged)+'</b>'+(tot.mngY+tot.mngN?'<br>재고관리 사용함 <b>'+won(tot.mngY)+'</b> · 가상재고 <b>'+won(tot.mngN)+'</b>':''); b.textContent='닫기'; b.disabled=false; b.onclick=function(){ closeDrawer(); boot(); }; return; }
      $('sbnmsg').textContent='저장 중… '+(k+1)+' / '+parts.length;
      api('sbn_sync',{rows:parts[k]}).then(function(j){ tot.added+=j.added; tot.updated+=j.updated; tot.stockChanged+=j.stockChanged; tot.mngY+=j.mngY||0; tot.mngN+=j.mngN||0; k++; $('sbnbar').style.width=(k/parts.length*100)+'%'; next(); })
        .catch(function(e){ b.disabled=false; fail(e); $('sbnmsg').textContent='중간에 멈췄어요. [가져오기]를 다시 누르면 이어서 갱신돼요'; parts=parts.slice(k); k=0; });
    };
    next();
  };
}

(function start(){
  // 서버 주소가 캐시된 옛 config.js 때문에 비어 보이면 최신본을 직접 다시 읽음
  if (API) return boot();
  fetch('config.js?v='+Date.now(),{cache:'no-store'}).then(function(r){ return r.text(); }).then(function(t){
    var m = t.match(/HUB_API\s*=\s*'([^']+)'/); if (m) API = m[1].trim();
  }).catch(function(){}).then(boot);
})();

/* 탭 숫자: 탭 안에는 숨기고, 선택한 탭의 개수를 탭 아래 한 줄로 보여줌 (탭이 길어지지 않게) */
function segCounts(){
  document.querySelectorAll('main .seg').forEach(function(sg){
    var bs=[].slice.call(sg.querySelectorAll('button')), has=false;
    bs.forEach(function(b){ var c=b.lastElementChild; if(c && /^(SMALL|B)$/.test(c.tagName) && /^[\d,]+$/.test(c.textContent.trim())){ c.classList.add('segn'); has=true; } });
    if (!has) return;
    sg.classList.add('hascnt');
    var on=sg.querySelector('button.on')||bs[0], c=on&&on.querySelector('.segn');
    var txt=c ? '총 '+c.textContent.trim()+'개' : '';
    // 탭이 있는 필터 줄 바로 아래(내용 시작 부분)에 표시
    var row=sg; while(row.parentElement && row.parentElement!==document.body && getComputedStyle(row.parentElement).display.indexOf('flex')>=0 && !row.parentElement.classList.contains('card')) row=row.parentElement;
    var nx=row.nextElementSibling;
    if (!nx || !nx.classList.contains('segcnt')){ nx=document.createElement('div'); nx.className='segcnt'; row.parentNode.insertBefore(nx, row.nextSibling); }
    if (nx.textContent!==txt) nx.textContent=txt;
  });
}
(function(){ var t=null; new MutationObserver(function(){ clearTimeout(t); t=setTimeout(segCounts,30); }).observe(document.documentElement,{childList:true,subtree:true}); })();

/* 새 버전 자동 확인: 화면 파일이 바뀌면 바로 최신본으로 (브라우저 캐시 때문에 옛 화면이 보이는 것 방지) */
(function(){
  var base=null, url=location.pathname;
  var sig=function(t){ var h=0; for(var i=0;i<t.length;i+=7) h=(h*31+t.charCodeAt(i))|0; return t.length+':'+h; };
  var get=function(){ return fetch(url+'?v='+Date.now(),{cache:'no-store'}).then(function(r){ return r.ok?r.text():null; }).catch(function(){ return null; }); };
  var go=function(){ location.replace(url+'?r='+Date.now()+(location.hash||'')); };
  var busy=function(){ return document.querySelector('.ov.on,.drawer.on,input:focus,textarea:focus,select:focus'); };
  var check=function(){ get().then(function(t){ if(!t) return; var s2=sig(t); if(base===null){ base=s2; return; }
    if(s2!==base){ if(document.hidden||!busy()) go(); else { base=s2; if(typeof toast==='function') toast('새 버전이 있어요 · 입력이 끝나면 새로고침(↻)해 주세요'); } } }); };
  // 처음 로드한 파일이 이미 옛 버전(캐시)일 수 있어서, 현재 문서와 서버본을 바로 비교
  get().then(function(t){ if(t) base=sig(t); });
  if (!/[?&]r=/.test(location.search)) Promise.all([   // 브라우저 캐시본(지금 보는 화면)과 서버 최신본의 ETag 비교
    fetch(url,{cache:'only-if-cached',mode:'same-origin'}).then(function(r){ return r.headers.get('etag'); }).catch(function(){ return null; }),
    fetch(url+'?v='+Date.now(),{cache:'no-store',method:'HEAD'}).then(function(r){ return r.headers.get('etag'); }).catch(function(){ return null; })
  ]).then(function(e){ if(e[0]&&e[1]&&e[0]!==e[1]) go(); });
  setInterval(check, 3*60e3);
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) check(); });
})();
</script>
