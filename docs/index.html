<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>셀렉트인 매출</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="robots" content="noindex, nofollow">
<script src="config.js"></script>
<meta name="theme-color" content="#0b4a35">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="셀렉트인 매출">
<style>
  :root{
    --bg:#f4f5f7; --card:#fff; --ink:#15171a; --sub:#6b7280; --line:#e6e8ec;
    --brand:#0b4a35; --accent:#178a62; --up:#d93a3a; --down:#2563eb; --soft:#e8f5ef; --warn:#b45309; --warnbg:#fff7e6;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0f1115; --card:#181b21; --ink:#eef0f3; --sub:#9aa3af; --line:#2a2f37;
      --brand:#7fd1ae; --accent:#3fbf8c; --up:#ff6b6b; --down:#6ea8ff; --soft:#16271f; --warn:#f5b454; --warnbg:#2a2214; }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif;font-size:15px;line-height:1.4}
  header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(12px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--line)}
  .login{max-width:360px;margin:12vh auto 0;text-align:center}
  .login h2{display:block;font-size:20px;margin-bottom:6px}
  .login p{color:var(--sub);font-size:14px;margin:0 0 20px}
  .login input{width:100%;height:48px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);padding:0 14px;font-size:16px;font-family:inherit}
  .login button{width:100%;height:48px;margin-top:10px;border:none;border-radius:12px;background:var(--brand);color:#fff;font-size:16px;font-weight:600;font-family:inherit}
  .login .msg{color:var(--up);font-size:13px;min-height:18px;margin-top:10px}
  .search{position:relative;margin-top:8px}
  .search input{width:100%;height:38px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);padding:0 38px 0 12px;font-size:14px;font-family:inherit}
  .search input.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--soft)}
  .search button{position:absolute;right:4px;top:4px;width:30px;height:30px;border:none;background:none;color:var(--sub);font-size:14px;display:none}
  .search input.on + button{display:block}
  .search input::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
  .search input::-webkit-calendar-picker-indicator{opacity:.4}
  .filt{display:flex;justify-content:space-between;align-items:center;background:var(--soft);color:var(--accent);border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px}
  .filt button{border:none;background:none;color:var(--accent);font-weight:600;font-family:inherit;font-size:13px}
  .pl.tap{cursor:pointer}
  .foot{text-align:center;padding:8px 0 calc(8px + env(safe-area-inset-bottom))}
  .foot button{border:none;background:none;color:var(--sub);font-size:12px;font-family:inherit;text-decoration:underline}
  .top{display:flex;justify-content:space-between;align-items:center}
  h1{margin:0;font-size:18px;color:var(--brand);letter-spacing:-.3px;display:flex;align-items:center;gap:8px}
  .logo{width:28px;height:28px;border-radius:7px}
  .login .logo{width:72px;height:72px;border-radius:18px;margin-bottom:14px}
  .stamp{font-size:12px;color:var(--sub)}
  .role{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--soft);color:var(--accent);margin-right:2px}
  .role.adm{background:var(--brand);color:#fff}
  .chips{display:flex;gap:6px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:999px;padding:6px 12px;font-size:13px;font-family:inherit}
  .chip.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
  .nav{display:flex;align-items:center;gap:6px;margin-top:8px}
  .nav button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;height:36px;min-width:36px;font-size:16px;flex:none}
  .nav button:disabled{opacity:.35}
  .nav input{flex:1;min-width:0;height:36px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);padding:0 6px;font-size:14px;font-family:inherit}
  .nav .tilde{color:var(--sub);flex:none}
  main{padding:12px 16px 40px;max-width:720px;margin:0 auto}
  .card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px;border:1px solid var(--line)}
  .label{font-size:13px;color:var(--sub);margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .big{font-size:30px;font-weight:700;letter-spacing:-.8px}
  .big small{font-size:16px;font-weight:500}
  .row{display:flex;gap:10px}
  .row>div{flex:1;min-width:0}
  .mini .v{font-size:17px;font-weight:600}
  .mini .k{font-size:12px;color:var(--sub)}
  .badge{display:inline-block;font-size:13px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--soft);white-space:nowrap}
  .up{color:var(--up)} .down{color:var(--down)}
  .live{background:linear-gradient(135deg,var(--brand),var(--accent));color:#fff;border:none}
  .live .label,.live .k{color:rgba(255,255,255,.75)}
  h2{font-size:15px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
  h2 small{font-weight:400;color:var(--sub);font-size:12px}
  .item{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
  .item:first-of-type{border-top:none}
  .item .n{font-weight:600}
  .item .s{font-size:12px;color:var(--sub)}
  .item .r{text-align:right;flex:none}
  .chart{display:flex;align-items:flex-end;gap:3px;height:120px;padding-top:6px}
  .bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;cursor:pointer;min-width:0}
  .bar i{display:block;width:100%;border-radius:3px 3px 0 0;background:var(--line);min-height:2px}
  .bar.in i{background:var(--accent)}
  .bar.sel i{background:var(--brand)}
  .bar span{font-size:10px;color:var(--sub);margin-top:4px;height:12px}
  .tip{font-size:13px;color:var(--sub);margin-top:8px;min-height:18px}
  .seg{display:flex;background:var(--bg);border-radius:9px;padding:2px;flex:none}
  .seg button{border:none;background:none;color:var(--sub);font-size:12px;padding:4px 10px;border-radius:7px;font-family:inherit}
  .seg button.on{background:var(--card);color:var(--ink);font-weight:600}
  .ptabs{display:flex;gap:6px;margin:-2px 0 8px;overflow-x:auto;scrollbar-width:none}
  .ptabs::-webkit-scrollbar{display:none}
  .ptabs button{flex:1 0 auto;border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:10px;padding:6px 10px;font-size:13px;font-family:inherit;display:flex;flex-direction:column;align-items:center;line-height:1.25}
  .ptabs button small{font-size:11px;opacity:.8}
  .ptabs button.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
  details.grp{border-top:1px solid var(--line)}
  details.grp:first-of-type{border-top:none}
  details.grp summary{list-style:none;cursor:pointer;border-top:none}
  details.grp summary::-webkit-details-marker{display:none}
  .caret{display:inline-block;width:14px;color:var(--sub);transition:transform .15s}
  details.grp[open] .caret{transform:rotate(90deg)}
  .sites{padding:0 0 8px 14px}
  .sites .pl:first-child{border-top:1px dashed var(--line)}
  .pl{padding:8px 0;border-top:1px solid var(--line)}
  .pl:first-child{border-top:none}
  .pl .t{display:flex;justify-content:space-between;font-size:14px;gap:8px}
  .pl .t b{font-weight:600;flex:none}
  .pl .c{font-size:11px;color:var(--sub);margin-left:6px}
  .track{height:5px;background:var(--bg);border-radius:3px;margin-top:5px;overflow:hidden}
  .track i{display:block;height:100%;background:var(--accent);border-radius:3px}
  .pay{display:flex;justify-content:space-between;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
  .pay:first-child{border-top:none}
  .pay.zero{color:var(--sub)}
  .warn{background:var(--warnbg);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px}
  .more{width:100%;margin-top:8px;border:none;background:var(--bg);color:var(--sub);border-radius:10px;padding:8px;font-size:13px;font-family:inherit}
  .empty{color:var(--sub);font-size:13px;padding:6px 0}
  #loading{text-align:center;color:var(--sub);padding:60px 0}
  .err{color:var(--up)}
  main{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
  .tabbar button{flex:1;border:none;background:none;color:var(--sub);font-family:inherit;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;border-radius:10px}
  .tabbar button b{font-size:19px;line-height:1;font-weight:400}
  .tabbar button.on{color:var(--brand);font-weight:700;background:var(--soft)}
  .al{display:flex;gap:8px;margin-bottom:12px}
  .al a{flex:1;background:var(--warnbg);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:13px;text-decoration:none}
  .al a b{display:block;font-size:17px}
  .tag{display:inline-block;font-size:11px;font-weight:600;padding:1px 6px;border-radius:6px;background:var(--soft);color:var(--accent);margin-left:4px;vertical-align:1px}
  .tag.gray{background:var(--bg);color:var(--sub)} .tag.red{background:var(--warnbg);color:var(--up)}
  .aseg{display:flex;background:var(--bg);border-radius:9px;padding:2px;flex:none}
  .aseg button{border:none;background:none;color:var(--sub);font-size:12px;padding:4px 10px;border-radius:7px;font-family:inherit}
  .aseg button.on{background:var(--card);color:var(--ink);font-weight:600}
  .arow{display:grid;grid-template-columns:52px 1fr auto;gap:8px;align-items:center;padding:6px 0;font-size:13px;border-top:1px solid var(--line)}
  .arow:first-of-type{border-top:none}
  .arow .bt{height:8px;background:var(--bg);border-radius:4px;overflow:hidden;display:flex}
  .arow .bt i{display:block;height:100%}
  .arow .v{text-align:right;white-space:nowrap}
  .arow .v small{display:block;font-size:11px;color:var(--sub)}
  .lg{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11px;color:var(--sub);margin-top:8px}
  .lg span{white-space:nowrap}
  .lg i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px}
  .cg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
  .cg .wh{font-size:11px;color:var(--sub);text-align:center;padding:2px 0}
  .cd{min-height:58px;border-radius:6px;padding:2px;background:var(--bg);cursor:pointer;overflow:hidden}
  .cd.out{opacity:.35}
  .cd.td{box-shadow:inset 0 0 0 2px var(--accent)}
  .cd.sel{background:var(--soft)}
  .cd b{display:flex;justify-content:space-between;font-size:11px;font-weight:600;margin-bottom:1px}
  .cd b em{font-style:normal;font-weight:700;font-size:9.5px;color:var(--brand)}
  .cd b em.lv{color:var(--accent)}
  .cd .sun{color:var(--up)} .cd .sat{color:var(--down)}
  .ev{display:block;font-size:9.5px;line-height:13px;height:13px;border-radius:3px;padding:0 2px;margin-top:1px;white-space:nowrap;overflow:hidden;color:#fff;background:var(--accent)}
  .ev.un{background:var(--warn)}
  .ev.more{background:none;color:var(--sub);padding:0}
  .ev.pe{background:#7c3aed}
  .ev.dl{background:var(--up)} .ev.pay{background:var(--down)} .ev.done{background:var(--line);color:var(--sub);text-decoration:line-through}
  .calnav{display:flex;align-items:center;gap:6px}
  .calnav button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;width:30px;height:28px;font-size:14px}
  .ev.mo{background:#64748b}
  .mm{background:var(--bg);border-radius:10px;padding:8px 10px;margin-top:6px;font-size:13px}
  .mm .mt{white-space:pre-wrap;word-break:break-word;line-height:1.45}
  .mm .mh{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:11px;color:var(--sub);margin-bottom:3px}
  .mm .mh b{color:var(--brand);font-weight:700}
  .mm .mh button{border:none;background:none;color:var(--sub);font-size:11px;font-family:inherit;padding:2px 4px}
  .mm .mh button.cf{color:var(--up);font-weight:700}
  .mform{margin-top:10px;display:grid;grid-template-columns:auto 1fr;gap:6px}
  .mform input,.mform textarea{font:inherit;font-size:14px;border:1px solid var(--line);border-radius:9px;padding:7px 9px;background:var(--card);color:var(--ink);min-width:0}
  .mform textarea{grid-column:1/-1;min-height:60px;resize:vertical}
  .mform .mb{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .mform .mb span{font-size:12px;color:var(--up)}
  .mform button{border:none;background:var(--brand);color:#fff;border-radius:9px;padding:8px 16px;font:inherit;font-size:14px;font-weight:600}
  .mform button:disabled{opacity:.5}
  .mbadge{font-size:11px;margin-left:5px;color:var(--warn);font-weight:600}
  .col{margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.25)}
</style>
</head>
<body>
<header id="hdr">
  <div class="top"><h1><img src="icon-192.png" alt="" class="logo">셀렉트인 매출</h1><span class="stamp" id="stamp"></span></div>
  <div class="chips" id="chips">
    <button class="chip" data-p="day">하루</button>
    <button class="chip" data-p="7">최근 7일</button>
    <button class="chip" data-p="30">최근 30일</button>
    <button class="chip" data-p="month">이번 달</button>
    <button class="chip" data-p="lastmonth">지난달</button>
    <button class="chip" data-p="custom">직접 설정</button>
  </div>
  <div class="nav">
    <button id="prevBtn" aria-label="이전">‹</button>
    <input type="date" id="startIn" aria-label="시작일">
    <span class="tilde" id="tilde">~</span>
    <input type="date" id="endIn" aria-label="종료일">
    <button id="nextBtn" aria-label="다음">›</button>
    <button id="reload" aria-label="새로고침">↻</button>
  </div>
  <div class="search">
    <input type="search" id="chq" list="chlist" placeholder="채널 검색 (예: 에이블리, 크림, 리셀, 겐더샵, 인플루언서명)" autocomplete="off" enterkeyhint="search">
    <button id="chx" aria-label="검색 지우기">✕</button>
    <datalist id="chlist"></datalist>
  </div>
</header>
<main id="app"><div id="loading">불러오는 중…</div></main>

<script>
/* ───── 리포트 계산 (화면에서 처리 → 기간 바꿔도 즉시) ───── */
var WD=['일','월','화','수','목','금','토'];
function shift(ymd,n){ var p=ymd.split('-'); return new Date(Date.UTC(+p[0],p[1]-1,+p[2]+n)).toISOString().slice(0,10); }
function wd(ymd){ var p=ymd.split('-'); return WD[new Date(Date.UTC(+p[0],p[1]-1,+p[2])).getUTCDay()]; }
function days(a,b){ var p=a.split('-'),q=b.split('-'); return Math.round((Date.UTC(+q[0],q[1]-1,+q[2])-Date.UTC(+p[0],p[1]-1,+p[2]))/864e5)+1; }

// daily 행: [0날짜,1채널그룹,2법인,3플랫폼,4건수,5매출,6수수료,7정산예정,8이익,9입금예정일,10입금확인]
function sumRows(rows){
  var s={cnt:0,sales:0,fee:0,settle:0,profit:0};
  for(var i=0;i<rows.length;i++){ var r=rows[i]; s.cnt+=r[4]; s.sales+=r[5]; s.fee+=r[6]; s.settle+=r[7]; s.profit+=r[8]; }
  s.margin=s.sales? s.profit/s.sales : null;
  return s;
}

// 채널 검색: 띄어쓰기로 여러 단어 → 모두 포함된 행만 (플랫폼·채널그룹·법인 기준)
function qTokens(q){ return String(q||'').toLowerCase().split(/\s+/).filter(Boolean); }
var GALIAS={'스마트스토어':'스토어팜','도소매':'도매'};
function rowText(r){ return r[3]+' '+r[1]+' '+(GALIAS[r[1]]||'')+' '+r[2]; }
function hit(text,toks){ text=String(text).toLowerCase(); for(var i=0;i<toks.length;i++) if(text.indexOf(toks[i])<0) return false; return true; }

function buildReport(D, start, end, q){
  var toks=qTokens(q);
  var today=D.today, n=days(start,end);
  var pEnd=shift(start,-1), pStart=shift(start,-n);
  var mStart=end.slice(0,8)+'01';
  var mains=D.mainCorps||['겐더샵','셀렉트인'];
  var inR=function(d,a,b){ return d>=a && d<=b; };
  var cur=[], prev=[], mtd=[], byDay={}, lastResell='';
  D.daily.forEach(function(r){
    (byDay[r[0]]||(byDay[r[0]]=[])).push(r);
    if(inR(r[0],start,end)) cur.push(r);
    if(inR(r[0],pStart,pEnd)) prev.push(r);
    if(inR(r[0],mStart,end)) mtd.push(r);
    if(r[1]==='리셀' && r[0]>lastResell) lastResell=r[0];
  });
  if(toks.length){
    var keep=function(r){ return hit(rowText(r),toks); };
    cur=cur.filter(keep); prev=prev.filter(keep); mtd=mtd.filter(keep);
    for(var k in byDay) byDay[k]=byDay[k].filter(keep);
  }
  var by=function(rows,i,v){ return rows.filter(function(r){ return r[i]===v; }); };

  // 법인별
  var names=mains.slice();
  cur.forEach(function(r){ if(names.indexOf(r[2])<0) names.push(r[2]); });
  var corps=names.map(function(c){
    var s=sumRows(by(cur,2,c)); s.name=c; s.prevSales=sumRows(by(prev,2,c)).sales; return s;
  }).filter(function(c){ return mains.indexOf(c.name)>=0 || c.sales; });

  // 사이트별: 채널그룹 고정 순서(사방넷/스토어팜/도매/리셀) + 그룹 안 사이트 목록
  var GORDER=['사방넷','스마트스토어','도소매','리셀'];
  var gnames=GORDER.slice();
  cur.concat(prev).forEach(function(r){ if(r[1] && gnames.indexOf(r[1])<0) gnames.push(r[1]); });
  var groups=gnames.map(function(g){
    var rows=by(cur,1,g), s=sumRows(rows); s.name=g; s.prevSales=sumRows(by(prev,1,g)).sales;
    var sm={};
    rows.forEach(function(r){ var k=r[3]+'|'+r[2]; var o=sm[k]||(sm[k]={plat:r[3],corp:r[2],cnt:0,sales:0,profit:0}); o.cnt+=r[4]; o.sales+=r[5]; o.profit+=r[8]; });
    s.sites=Object.keys(sm).map(function(k){ return sm[k]; }).filter(function(x){ return x.sales; }).sort(function(a,b){ return b.sales-a.sales; });
    return s;
  }).filter(function(g){ return GORDER.indexOf(g.name)>=0 || g.sales || g.prevSales; });

  // 플랫폼별 (기간 / 월누적)
  var pmap={};
  var touch=function(r){ var k=r[2]+'|'+r[3]; return pmap[k]||(pmap[k]={corp:r[2],plat:r[3],cnt:0,sales:0,profit:0,mtdSales:0}); };
  cur.forEach(function(r){ var p=touch(r); p.cnt+=r[4]; p.sales+=r[5]; p.profit+=r[8]; });
  mtd.forEach(function(r){ touch(r).mtdSales+=r[5]; });
  var platforms=Object.keys(pmap).map(function(k){ var p=pmap[k]; p.margin=p.sales?p.profit/p.sales:null; return p; });

  // 일별 추이: 기간이 7일 이상이면 기간 전체(최대 62일), 아니면 종료일 기준 14일
  var tStart = n>=7 ? (n>62 ? shift(end,-61) : start) : shift(end,-13);
  var trend=[];
  for(var d=tStart; d<=end; d=shift(d,1)){
    var s=sumRows(byDay[d]||[]);
    trend.push({d:d,wd:wd(d),sales:s.sales,profit:s.profit,cnt:s.cnt,inRange:inR(d,start,end)});
  }

  // 입금예정 (오늘부터 7일, 입금확인 제외)
  var payAmt={};
  D.daily.forEach(function(r){ if(r[9] && !r[10] && (!toks.length || hit(rowText(r),toks))) payAmt[r[9]]=(payAmt[r[9]]||0)+r[7]; });
  var payments=[];
  for(var j=0;j<7;j++){ var pd=shift(today,j); payments.push({d:pd,wd:wd(pd),amount:payAmt[pd]||0}); }

  // 공구 [0날짜,1인플루언서,2상품,3건수,4매출] — 기간 기준
  var gmap={};
  D.gonggu.forEach(function(g){
    if(!inR(g[0],start,end)) return;
    if(toks.length && !hit(g[1]+' '+g[2]+' 공구 스마트스토어',toks)) return;
    var o=gmap[g[1]]||(gmap[g[1]]={who:g[1],items:[],sales:0,cnt:0});
    if(g[2] && o.items.indexOf(g[2])<0) o.items.push(g[2]);
    o.sales+=g[4]; o.cnt+=g[3];
  });
  var gonggu=Object.keys(gmap).map(function(k){ return gmap[k]; }).sort(function(a,b){ return b.sales-a.sales; });

  var total=sumRows(cur);
  return {
    start:start, end:end, n:n, pStart:pStart, pEnd:pEnd, today:today, monthStart:mStart,
    total:total, prevTotal:sumRows(prev), mtd:sumRows(mtd),
    avg: total.sales/n,
    corps:corps, groups:groups, platforms:platforms, trend:trend, payments:payments, gonggu:gonggu,
    gongguSales:gonggu.reduce(function(a,g){ return a+g.sales; },0),
    sabangMissing:n===1 && total.sales>0 && !cur.some(function(r){ return r[1]==='사방넷'; }),
    lastResell:lastResell, q:toks.join(' '),
    unknownCorpSales:sumRows(by(cur,2,'확인필요')).sales,
    live:D.live, generatedAt:D.generatedAt
  };
}
</script>

<script>
var GLABEL={'스마트스토어':'스토어팜','도소매':'도매'}, openGroups={};
var R=null, D=null, platMode='range', platAll=false, platCorp='', syncing=false;
var P={mode:'day', start:'', end:''}, userNav=false, Q='';
var TABS=[['home','🏠','통합'],['sum','📊','요약'],['ch','🏪','채널'],['gb','🤝','공구&행사'],['pay','💰','입금']];
var TAB=(function(){ try{ return localStorage.getItem('drTab_v1')||'home'; }catch(e){ return 'sum'; } })();
function setTab(t){ TAB=t; try{ localStorage.setItem('drTab_v1',t); }catch(e){} render(); window.scrollTo(0,0); }
var LS_KEY='drData_v2', LS_P='drPeriod_v1';
var $=function(id){ return document.getElementById(id); };
var won=function(n){ return Math.round(n||0).toLocaleString('ko-KR'); };
var man=function(n){ n=n||0; if(Math.abs(n)>=1e8) return (n/1e8).toFixed(1)+'억'; if(Math.abs(n)>=1e4) return Math.round(n/1e4).toLocaleString('ko-KR')+'만'; return won(n); };
var pct=function(x){ return x==null? '-' : (x*100).toFixed(1)+'%'; };
var md=function(d){ return d.slice(5).replace('-','/'); };
function chg(a,b,label){
  if(!b) return '<span class="badge">'+(label||'비교')+' -</span>';
  var p=(a-b)/b*100, cls=p>=0?'up':'down';
  return '<span class="badge '+cls+'">'+(p>=0?'▲ ':'▼ ')+Math.abs(p).toFixed(1)+'%</span>';
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function lsGet(k){ try{ var s=localStorage.getItem(k); return s?JSON.parse(s):null; }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k, typeof v==='string'?v:JSON.stringify(v)); }catch(e){} }

/* ───── 기간 ───── */
function maxDay(){ return shift(D.today,-1); }
function applyPreset(mode){
  var y=maxDay();
  P.mode=mode;
  if(mode==='day'){ P.start=P.end=y; }
  else if(mode==='7'){ P.end=y; P.start=shift(y,-6); }
  else if(mode==='30'){ P.end=y; P.start=shift(y,-29); }
  else if(mode==='month'){ P.start=D.today.slice(0,8)+'01'; P.end=y<P.start?P.start:y; }
  else if(mode==='lastmonth'){ var last=shift(D.today.slice(0,8)+'01',-1); P.start=last.slice(0,8)+'01'; P.end=last; }
  else if(mode==='custom'){ if(!P.start){ P.end=y; P.start=shift(y,-6); } }
}
function stepPeriod(dir){
  if(P.mode==='month'||P.mode==='lastmonth'){
    var base=dir<0? shift(P.start,-1) : shift(P.end.slice(0,8)+'01',40);
    P.start=base.slice(0,8)+'01';
    var nextM=shift(P.start,40).slice(0,8)+'01';
    P.end=shift(nextM,-1);
  } else {
    var n=days(P.start,P.end);
    P.start=shift(P.start,dir*n); P.end=shift(P.end,dir*n);
  }
  if(P.end>maxDay()) P.end=maxDay();
  if(P.mode==='lastmonth') P.mode='month';
}
function syncControls(){
  Array.prototype.forEach.call(document.querySelectorAll('.chip'),function(c){ c.classList.toggle('on',c.dataset.p===P.mode); });
  var single=P.mode==='day';
  $('startIn').value=P.start; $('endIn').value=P.end;
  $('endIn').style.display=single?'none':''; $('tilde').style.display=single?'none':'';
  $('startIn').max=$('endIn').max=maxDay();
  $('nextBtn').disabled = P.end>=maxDay();
}
function show(){
  if(P.start>P.end){ var t=P.start; P.start=P.end; P.end=t; }
  syncControls();
  R=buildReport(D,P.start,P.end,Q);
  fillChannels();
  render();
  lsSet(LS_P,P);
}
function go(mode){ userNav=true; applyPreset(mode); show(); }

/* ───── 데이터 로딩: 저장본 즉시 → 서버 최신본으로 교체 ───── */
function setData(json, fromLocal){
  var d; try{ d=typeof json==='string'?JSON.parse(json):json; }catch(e){ return; }
  if(!d || d.v!==2) return;
  var dayChanged = D && D.today!==d.today;
  D=d;
  if(!fromLocal) lsSet(LS_KEY,json);
  if(!P.start || dayChanged && !userNav) applyPreset(P.mode);
  if(P.end>maxDay()) P.end=maxDay();
  show();
}
/* ───── 서버(Apps Script) 호출 ───── */
var LS_TOKEN='drToken_v1';
function api(body){
  // text/plain 본문 → 브라우저 사전요청 없이 Apps Script로 바로 전송
  return fetch(window.SALES_API,{method:'POST',body:JSON.stringify(body),redirect:'follow',cache:'no-store'})
    .then(function(res){ if(!res.ok) throw new Error('HTTP '+res.status); return res.text(); });
}
function fetchData(force){
  var token=null; try{ token=localStorage.getItem(LS_TOKEN); }catch(e){}
  if(token && token.split('.').length!==3){ try{ localStorage.removeItem(LS_TOKEN); localStorage.removeItem(LS_KEY); }catch(e){} token=null; D=null; }
  if(!token){ showLogin(); return; }
  syncing=true; updStamp();
  api({action:'data',token:token,force:!!force})
    .then(function(txt){
      var j; try{ j=JSON.parse(txt); }catch(e){ throw new Error('응답을 읽지 못했습니다'); }
      if(j.error==='login'){ try{ localStorage.removeItem(LS_TOKEN); }catch(e){} syncing=false; showLogin(); throw null; }
      if(j.error) throw new Error(j.error);
      return txt;
    })
    .then(function(txt){ syncing=false; setData(txt,false); })
    .catch(function(e){
      syncing=false; updStamp();
      if(!e) return;
      if(!D) $('app').innerHTML='<div id="loading" class="err">불러오지 못했습니다<br><small>'+esc(e.message||e)+'</small></div>';
      else $('stamp').textContent=D.generatedAt+' 기준 · 갱신 실패';
    });
}

/* ───── 로그인 ───── */
function showLogin(){
  $('hdr').style.display='none';
  $('app').innerHTML='<div class="login"><img src="icon-192.png" alt="" class="logo"><h2>셀렉트인 매출</h2><p>앱 비밀번호를 입력하세요</p>'
    +'<form id="lf"><input type="password" id="pw" autocomplete="current-password" placeholder="비밀번호">'
    +'<button type="submit">로그인</button><div class="msg" id="lmsg"></div></form></div>';
  $('lf').onsubmit=function(ev){
    ev.preventDefault();
    var btn=this.querySelector('button'); btn.disabled=true; $('lmsg').textContent='';
    api({action:'login',password:$('pw').value})
      .then(function(txt){ return JSON.parse(txt); })
      .then(function(j){
        btn.disabled=false;
        if(!j.token){ $('lmsg').textContent=j.error||'로그인 실패'; return; }
        try{ localStorage.setItem(LS_TOKEN,j.token); }catch(e){}
        $('hdr').style.display='';
        $('app').innerHTML='<div id="loading">불러오는 중…</div>';
        fetchData(false);
      })
      .catch(function(){ btn.disabled=false; $('lmsg').textContent='연결 실패. 다시 시도하세요.'; });
  };
  setTimeout(function(){ if($('pw')) $('pw').focus(); },50);
}
function logout(){
  try{ localStorage.removeItem(LS_KEY); localStorage.removeItem(LS_TOKEN); }catch(e){}
  D=null; showLogin();
}
function updStamp(){
  var role=D&&D.role==='share'?'공유':(D&&D.role==='admin'?'관리자':'');
  $('stamp').innerHTML=(role?'<span class="role'+(D.role==='admin'?' adm':'')+'">'+role+'</span> ':'')+(D?D.generatedAt+' 기준':'')+(syncing?' · 갱신 중…':'');
}

/* ───── 화면 ───── */
function render(){

  if(R.unknownCorpSales) h+='<div class="warn">⚠ 사업장(법인) 확인필요 매출 '+won(R.unknownCorpSales)+'원 — 설정 탭 확인</div>';

  if(R.q) h='<div class="filt"><span>🔎 \''+esc(Q.trim())+'\' 채널만 집계 중</span><button onclick="setQ(\'\')">전체 보기</button></div>'+h;
  var top=h; h='';

  var L=R.live;
  if(L && L.isToday && !R.q){
    S.home+='<div class="card live"><div class="label"><span>오늘 실시간 · '+md(R.today)+'</span><span>사방넷 '+esc(L.updSabang)+' · 스토어 '+esc(L.updStore)+'</span></div>'

      +'<div><div class="k">발송</div><div class="v">'+man(L.shipSales)+'</div></div></div>'
      +(L.colQty!=null?'<div class="row mini col">'
        +'<div><div class="k">수집 수량 (사방넷)</div><div class="v">'+won(L.colQty)+'개</div></div>'
        +'<div><div class="k">겐더샵</div><div class="v">'+won(L.colGs)+'개</div></div>'

  }
  S.home+=homeHtml();

  h+='<div class="card"><div class="label"><span>'+title+'</span>'+chg(t.sales,p.sales,cmpLabel)+'</div>'

    +'<div><div class="k">주문</div><div class="v">'+won(t.cnt)+'건</div></div>'

    +'<div class="label" style="margin:10px 0 0">'+cmpLabel+' ('+md(R.pStart)+(single?'':'~'+md(R.pEnd))+') '+won(p.sales)+'원</div></div>';

  if(single){
    h+='<div class="card"><div class="label"><span>'+R.end.slice(5,7)+'월 누적 ('+md(R.monthStart)+'~'+md(R.end)+')</span></div>'
      +'<div class="row mini">'
      +'<div><div class="k">매출</div><div class="v">'+man(m.sales)+'</div></div>'
      +'<div><div class="k">이익</div><div class="v">'+man(m.profit)+'</div></div>'
      +'<div><div class="k">이익율</div><div class="v">'+pct(m.margin)+'</div></div>'
      +'<div><div class="k">주문</div><div class="v">'+won(m.cnt)+'건</div></div></div></div>';
  }

  h+='<div class="card" id="memoSum"></div>';
  S.sum+=h; h='';
  h+='<div class="card"><h2>사업장별 <small>'+cmpLabel+' 대비</small></h2>';
  R.corps.forEach(function(c){
    h+='<div class="item"><div><div class="n">'+esc(c.name)+'</div><div class="s">'+won(c.cnt)+'건 · 이익 '+man(c.profit)+' · '+pct(c.margin)+'</div></div>'
      +'<div class="r"><div class="n">'+won(c.sales)+'</div><div class="s">'+chg(c.sales,c.prevSales,cmpLabel)+'</div></div></div>';
  });
  h+='</div>';

  h+='<div class="card"><h2>사이트별 <small>눌러서 사이트 펼치기</small></h2>';
  R.groups.forEach(function(g){
    var label=GLABEL[g.name]||g.name;
    h+='<details class="grp"'+(openGroups[g.name]?' open':'')+' data-g="'+esc(g.name)+'"><summary class="item"><div><div class="n"><span class="caret">▸</span>'+esc(label)+'</div><div class="s">'+won(g.cnt)+'건 · 이익율 '+pct(g.margin)+' · 사이트 '+g.sites.length+'개</div></div>'
      +'<div class="r"><div class="n">'+won(g.sales)+'</div><div class="s">'+chg(g.sales,g.prevSales,cmpLabel)+'</div></div></summary><div class="sites">';
    if(!g.sites.length) h+='<div class="empty">선택한 기간 매출 없음</div>';
    var mx=g.sites.length?g.sites[0].sales:1;
    g.sites.forEach(function(x){
      h+='<div class="pl tap" data-q="'+esc(x.plat+' '+x.corp)+'"><div class="t"><span>'+esc(x.plat)+'<span class="c">'+esc(x.corp)+' · '+won(x.cnt)+'건</span>'+memoBadge(x.plat,R.start,R.end)+'</span><b>'+won(x.sales)+'</b></div>'
        +'<div class="track"><i style="width:'+(x.sales/mx*100)+'%"></i></div></div>';
    });
    h+='</div></details>';
  });
  h+='</div>';

  S.ch+=h; h='';
  var mx=Math.max.apply(null,R.trend.map(function(x){return x.sales;}).concat([1]));
  var every=Math.ceil(R.trend.length/14);
  h+='<div class="card"><h2>일별 매출 <small>막대를 누르면 상세 · 두 번 누르면 그날로</small></h2><div class="chart">';
  R.trend.forEach(function(x,i){
    var lab=(i%every===0||i===R.trend.length-1)? (+x.d.slice(8)) : '';
    h+='<div class="bar'+(x.inRange?' in':'')+'" data-i="'+i+'"><i style="height:'+Math.max(2,x.sales/mx*100)+'%"></i><span>'+lab+'</span></div>';
  });
  h+='</div><div class="tip" id="tip">'+tipText(R.trend[R.trend.length-1])+'</div></div>';

  h+='<div class="card" id="ana"></div>';
  S.sum+=h; h='';
  h+='<div class="card"><h2>플랫폼별<span class="seg"><button data-m="range" class="'+(platMode==='range'?'on':'')+'">선택 기간</button><button data-m="mtd" class="'+(platMode==='mtd'?'on':'')+'">'+R.end.slice(5,7)+'월 누적</button></span></h2><div class="ptabs" id="ptabs"></div><div id="plats"></div></div>';

  S.ch+=h; h='';

  if(D.role!=='share' && D.gbm && D.gbm.length){
    var gy=D.today.slice(0,4), gl=D.gbm.filter(function(r){return r[0].slice(0,4)===gy;}), gt=[0,0,0,0,0,0];

      +'<div><div class="k">셀렉트인하우스</div><div class="v">'+man(gt[2])+'</div></div>'
      +'<div><div class="k">모아하우스</div><div class="v">'+man(gt[4])+'</div></div></div><div style="margin-top:8px">';
    gl.slice().reverse().forEach(function(r){
      var t=r[1]+r[3]+r[5];
      h+='<div class="arow"><span>'+(+r[0].slice(5))+'월</span><div class="bt"><i style="width:'+(r[1]/gmx*100)+'%;background:#7c3aed"></i><i style="width:'+(r[3]/gmx*100)+'%;background:var(--accent)"></i><i style="width:'+(r[5]/gmx*100)+'%;background:#d4a017"></i></div><div class="v">'+man(t)+'<small>계산서 '+r[2]+'건 · 주문 '+won(r[4]+r[6])+'건</small></div></div>';
    });
    h+='</div><div class="lg"><span><i style="background:#7c3aed"></i>국세청 공동구매</span><span><i style="background:var(--accent)"></i>셀렉트인하우스</span><span><i style="background:#d4a017"></i>모아하우스</span></div></div>';
  }
  h+='<div class="card"><h2>공구 · 인플루언서 <small>기간 합계 '+man(R.gongguSales)+'</small></h2>';

    h+='<div class="label"><span>'+md(CALSEL)+'('+wd(CALSEL)+') 정산 할 일 '+sm.length+'건</span></div>';
    sm.forEach(function(x){ var r=x.r;
      h+='<div class="item"><div><div class="n">'+esc(x.t)+(x.k==='done'?'<span class="tag gray">완료</span>':x.k==='dl'?'<span class="tag red">정산서 기한</span>':'<span class="tag">셀러 지급일</span>')+'</div><div class="s">'+esc(r[3])+' · '+md(r[0])+'~'+md(r[1])+' 공구</div></div>'+(r[6]?'<div class="r"><div class="n">'+man(r[6])+'</div></div>':'')+'</div>'; });
  }
  if(CALF!=='ev'){
  h+='<div class="label"'+(sm.length?' style="margin-top:8px"':'')+'><span>'+md(CALSEL)+'('+wd(CALSEL)+') 진행 공구 '+sel.length+'건</span></div>';
  if(!sel.length) h+='<div class="empty">없음</div>';
  }
  sel.forEach(function(r){
    var tag=r[2].indexOf('미확정')>=0?'<span class="tag red">미확정</span>':'';
    h+='<div class="item"><div><div class="n">'+esc(r[4]||r[3])+tag+'</div><div class="s">'+esc(r[5])+' · '+md(r[0])+'~'+md(r[1])+'</div></div>'+(r[6]?'<div class="r"><div class="n">'+man(r[6])+'</div></div>':'')+'</div>';
  });
  var se=onE(CALSEL);
  if(se.length){
    h+='<div class="label" style="margin-top:8px"><span>'+md(CALSEL)+'('+wd(CALSEL)+') 플랫폼 행사 '+se.length+'건</span></div>';
    se.forEach(function(r){ h+='<div class="item"><div><div class="n">'+esc(evLab(r))+'<span class="tag gray">'+(r[2]==='겐'?'겐더샵':'셀렉트인')+'</span>'+(r[6]?'<span class="tag">'+esc(r[6])+'</span>':'')+'</div><div class="s">'+esc(r[5])+' · '+md(r[0])+'~'+md(r[1])+'</div></div></div>'; });
  }
  var smo=memosOn(CALSEL);
  h+='<div class="label" style="margin-top:10px"><span>'+md(CALSEL)+'('+wd(CALSEL)+') 메모 '+smo.length+'건</span></div>';
  h+=memoList(smo,false)+memoForm('cal-'+CALSEL,CALSEL,'');
  h+='</div>';
  $('cal').innerHTML=h;
  bindMemo($('cal'));
  Array.prototype.forEach.call(document.querySelectorAll('#cal .aseg button'),function(b){ b.onclick=function(){ CALF=b.dataset.f; try{ localStorage.setItem('drCalF_v1',CALF); }catch(e){} renderCal(); }; });
  var mv=function(n){ var dt=new Date(Date.UTC(y,m-1+n,1)); CALM=dt.toISOString().slice(0,7); renderCal(); };
  $('cprev').onclick=function(){ mv(-1); }; $('cnext').onclick=function(){ mv(1); };
  Array.prototype.forEach.call(document.querySelectorAll('.cd'),function(c){ c.onclick=function(){ CALSEL=c.dataset.d; if(CALSEL.slice(0,7)!==CALM) CALM=CALSEL.slice(0,7); renderCal(); }; });
}
/* ───── 메모 (시트 '앱메모' 탭에 저장 · 관리자/공유 모두 보기·쓰기) ───── */
var MDRAFT={};
function memos(){ return (D&&D.memos)||[]; }
function memosOn(d){ return memos().filter(function(x){ return x[1]===d; }); }
function memoMatch(x,name){ var t=String(x[2]||'').toLowerCase(), n=String(name||'').toLowerCase(); return !!t && !!n && (t===n || t.indexOf(n)>=0 || n.indexOf(t)>=0); }
function memoBadge(name,a,b){ var n=memos().filter(function(x){ return x[1]>=a && x[1]<=b && memoMatch(x,name); }).length; return n?'<span class="mbadge">📝'+n+'</span>':''; }
function memoList(list,showDate){
  if(!list.length) return '<div class="empty">메모 없음</div>';
  return list.map(function(x){
    var canDel = D.role==='admin' || x[4]==='공유';
    return '<div class="mm"><div class="mh"><span>'+(showDate?'<b>'+md(x[1])+'('+wd(x[1])+')</b> ':'')+(x[2]?'<span class="tag">'+esc(x[2])+'</span> ':'<span class="tag gray">전체</span> ')+esc(x[4])+(x[5]?' · '+esc(x[5].slice(5)):'')+'</span>'
      +(canDel?'<button data-del="'+esc(x[0])+'">삭제</button>':'')+'</div><div class="mt">'+esc(x[3])+'</div></div>';
  }).join('');
}
function memoForm(key,date,target){
  var dr=MDRAFT[key]||{};
  return '<form class="mform" data-k="'+key+'"><input type="date" name="d" value="'+esc(dr.d||date)+'" max="'+shift(D.today,365)+'" required>'
    +'<input name="t" list="chlist" placeholder="대상 (비우면 전체)" value="'+esc(dr.t!=null?dr.t:target)+'" maxlength="40" autocomplete="off">'
    +'<textarea name="x" placeholder="메모 입력" maxlength="500">'+esc(dr.x||'')+'</textarea>'
    +'<div class="mb"><span class="mmsg"></span><button type="submit">메모 저장</button></div></form>';
}
function renderMemoSum(){
  var toks=qTokens(Q), list=memos().filter(function(x){ return x[1]>=R.start && x[1]<=R.end && (!toks.length || hit(x[2]+' '+x[3],toks)); }).slice().reverse();
  var h='<h2>메모 <small>'+(R.n===1?md(R.end):md(R.start)+'~'+md(R.end))+(toks.length?' · \''+esc(Q.trim())+'\'':'')+' · '+list.length+'건</small></h2>';
  h+=memoList(list,R.n>1)+memoForm('sum',R.end,Q.trim());
  $('memoSum').innerHTML=h; bindMemo($('memoSum'));
}
function memoSave(j){
  if(j.memos){ D.memos=j.memos; lsSet(LS_KEY,JSON.stringify(D)); }
}
function memoCall(body,done){
  var token=null; try{ token=localStorage.getItem(LS_TOKEN); }catch(e){}
  body.token=token;
  api(body).then(function(t){ return JSON.parse(t); }).then(function(j){
    if(j.error==='login'){ showLogin(); return; }
    memoSave(j); done(j.error||null);
  }).catch(function(){ done('연결 실패. 다시 시도하세요.'); });
}
function bindMemo(root){
  Array.prototype.forEach.call(root.querySelectorAll('form.mform'),function(f){
    var k=f.dataset.k, keep=function(){ MDRAFT[k]={d:f.d.value,t:f.t.value,x:f.x.value}; };
    f.oninput=keep;
    f.onsubmit=function(ev){
      ev.preventDefault();
      var btn=f.querySelector('button'), msg=f.querySelector('.mmsg');
      if(!f.x.value.trim()){ msg.textContent='내용을 입력하세요'; return; }
      btn.disabled=true; btn.textContent='저장 중…'; msg.textContent='';
      memoCall({action:'memo_add',date:f.d.value,target:f.t.value.trim(),text:f.x.value},function(err){
        if(err){ btn.disabled=false; btn.textContent='메모 저장'; msg.textContent=err; return; }
        delete MDRAFT[k]; show();
      });
    };
  });
  Array.prototype.forEach.call(root.querySelectorAll('button[data-del]'),function(b){
    b.onclick=function(){
      if(!b.classList.contains('cf')){ b.classList.add('cf'); b.textContent='한 번 더 누르면 삭제'; setTimeout(function(){ b.classList.remove('cf'); b.textContent='삭제'; },3000); return; }
      b.disabled=true; b.textContent='삭제 중…';
      memoCall({action:'memo_del',id:b.dataset.del},function(err){ if(err){ b.disabled=false; b.classList.remove('cf'); b.textContent='삭제'; alertMsg(b,err); return; } show(); });
    };
  });
}
function alertMsg(el,t){ var m=el.closest('.mm'); if(m) m.insertAdjacentHTML('beforeend','<div class="mmsg" style="color:var(--up);font-size:12px">'+esc(t)+'</div>'); }
function tipText(x){
  return '<b style="color:var(--ink)">'+md(x.d)+'('+x.wd+')</b> 매출 '+won(x.sales)+'원 · 이익 '+man(x.profit)+' · '+won(x.cnt)+'건';
}

function renderPlats(){
  var key=platMode==='range'?'sales':'mtdSales';
  // 법인 탭: 전체 / 겐더샵 / 셀렉트인 (+기타 법인이 있으면 추가)
  var corps=(D.mainCorps||['겐더샵','셀렉트인']).slice();
  R.platforms.forEach(function(x){ if(x[key]>0 && corps.indexOf(x.corp)<0) corps.push(x.corp); });
  if(platCorp && corps.indexOf(platCorp)<0) platCorp='';
  var tot=function(c){ return R.platforms.reduce(function(a,x){ return a+((!c||x.corp===c)?x[key]:0); },0); };
  $('ptabs').innerHTML=[''].concat(corps).map(function(c){
    return '<button data-c="'+esc(c)+'" class="'+(platCorp===c?'on':'')+'">'+(c?esc(c):'전체')+'<small>'+man(tot(c))+'</small></button>';
  }).join('');
  Array.prototype.forEach.call(document.querySelectorAll('#ptabs button'),function(b){
    b.onclick=function(){ platCorp=b.dataset.c; platAll=false; renderPlats(); };
  });
  var list=R.platforms.filter(function(x){return x[key]>0 && (!platCorp || x.corp===platCorp);}).sort(function(a,b){return b[key]-a[key];});
  var mx=list.length?list[0][key]:1, showL=platAll?list:list.slice(0,8), h='';
  if(!list.length) h='<div class="empty">매출 없음</div>';
  showL.forEach(function(x){
    h+='<div class="pl tap" data-q="'+esc(x.plat+' '+x.corp)+'"><div class="t"><span>'+esc(x.plat)+'<span class="c">'+esc(x.corp)+'</span></span><b>'+won(x[key])+'</b></div>'
      +'<div class="track"><i style="width:'+(x[key]/mx*100)+'%"></i></div></div>';
  });
  if(list.length>8) h+='<button class="more" id="moreBtn">'+(platAll?'접기':'전체 '+list.length+'개 보기')+'</button>';
  $('plats').innerHTML=h;
  if($('moreBtn')) $('moreBtn').onclick=function(){ platAll=!platAll; renderPlats(); };
  Array.prototype.forEach.call(document.querySelectorAll('.pl.tap'),function(el){ el.onclick=function(){ setQ(el.dataset.q); window.scrollTo(0,0); }; });
}

/* ───── 이벤트 ───── */
Array.prototype.forEach.call(document.querySelectorAll('.chip'),function(c){
  c.onclick=function(){ if(D) go(c.dataset.p); };
});
$('startIn').onchange=function(){
  if(!D||!this.value) return; userNav=true;
  if(P.mode==='day'){ P.start=P.end=this.value; }
  else { P.mode='custom'; P.start=this.value; }
  show();
};
$('endIn').onchange=function(){ if(!D||!this.value) return; userNav=true; P.mode='custom'; P.end=this.value; show(); };
$('prevBtn').onclick=function(){ if(D){ userNav=true; stepPeriod(-1); show(); } };
$('nextBtn').onclick=function(){ if(D){ userNav=true; stepPeriod(1); show(); } };
$('reload').onclick=function(){ checkUpdate(); fetchData(true); };

/* ───── 채널 검색 ───── */
function setQ(v){ Q=v||''; $('chq').value=Q; $('chq').classList.toggle('on',!!Q.trim()); if(D) show(); }
var qTimer=null;
$('chq').oninput=function(){ var v=this.value; this.classList.toggle('on',!!v.trim()); clearTimeout(qTimer); qTimer=setTimeout(function(){ Q=v; if(D) show(); },200); };
$('chx').onclick=function(){ setQ(''); };
var chFilled='';
function fillChannels(){
  if(!D || chFilled===D.generatedAt) return; chFilled=D.generatedAt;
  var set={};
  D.daily.forEach(function(r){ if(r[3]) set[r[3]]=1; if(r[1]) set[r[1]]=1; if(r[2]) set[r[2]]=1; });
  D.gonggu.forEach(function(g){ if(g[1]) set[g[1]]=1; });
  $('chlist').innerHTML=Object.keys(set).sort().map(function(k){ return '<option value="'+esc(k)+'">'; }).join('');
}

/* ───── 시작: 폰에 저장된 데이터로 즉시 표시 → 뒤에서 최신 데이터 받기 ───── */
(function(){
  var sp=lsGet(LS_P); if(sp && sp.mode) P.mode=sp.mode;
  var cached=lsGet(LS_KEY);
  if(cached && cached.v===2){ D=cached; applyPreset(P.mode); show(); }
  fetchData(false);
})();

// 앱으로 다시 돌아오면(백그라운드 → 화면) 최신 데이터 받기
document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='visible' && D && !syncing) fetchData(false); });

var APP_BUILD='b20261013m';
function checkUpdate(){ fetch('index.html?v='+Date.now(),{cache:'no-store'}).then(function(r){return r.text();}).then(function(t){ var m=t.match(/APP_BUILD='([^']+)'/); if(m && m[1]!==APP_BUILD) location.reload(); }).catch(function(){}); }
document.addEventListener('visibilitychange',function(){ if(!document.hidden) checkUpdate(); });
setTimeout(checkUpdate,1500);
if('serviceWorker' in navigator){ window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); }); }
</script>
